<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading…</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

<style>
/* ============================================================
   ROOT / THEME VARIABLES (populated further by JS from JSON)
   ============================================================ */
:root{
  --primary:#F4A623;
  --accent:#E85D2C;
  --dark:#12100E;
  --dark-2:#1B1815;
  --light:#F4F0E8;
  --white:#FFFFFF;
  --text:#2A2622;
  --steel:#6B6560;
  --line: rgba(255,255,255,0.14);
  --line-dark: rgba(18,16,14,0.12);
  --font-display:'Archivo Black', 'Archivo', sans-serif;
  --font-heading:'Archivo', sans-serif;
  --font-body:'Inter', sans-serif;
  --font-mono:'JetBrains Mono', monospace;
  --dur: 800ms;
  --ease: cubic-bezier(.16,.84,.44,1);
}

*,*::before,*::after{box-sizing:border-box;}
html{scroll-behavior:smooth;}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
}
body{
  margin:0;
  font-family:var(--font-body);
  color:var(--text);
  background:var(--light);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%; display:block;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
ul{margin:0; padding:0; list-style:none;}
h1,h2,h3,h4,p{margin:0;}
.container{
  max-width:1280px;
  margin:0 auto;
  padding:0 32px;
}
@media (max-width:768px){ .container{padding:0 20px;} }

/* focus states for accessibility */
a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
  outline:2px solid var(--primary);
  outline-offset:3px;
}

.section-label{
  display:inline-flex;
  align-items:center;
  gap:10px;
  font-family:var(--font-mono);
  font-size:12px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--accent);
  font-weight:600;
  margin-bottom:18px;
}
.section-label::before{
  content:'';
  width:24px;
  height:2px;
  background:var(--accent);
  display:inline-block;
}
.section-heading{
  font-family:var(--font-heading);
  font-weight:800;
  font-size:clamp(28px, 4vw, 46px);
  line-height:1.08;
  letter-spacing:-.01em;
  color:var(--dark);
}
.section-sub{
  font-size:16px;
  line-height:1.7;
  color:var(--steel);
  max-width:640px;
  margin-top:16px;
}
.section-head{
  margin-bottom:56px;
}
.section-head.center{ text-align:center; margin-left:auto; margin-right:auto; }
.section-head.center .section-sub{ margin-left:auto; margin-right:auto; }
.section-head.center .section-label::before{ display:none; }

section{ position:relative; }
.pad{ padding:110px 0; }
@media (max-width:768px){ .pad{ padding:72px 0; } }

/* blueprint corner bracket – signature motif */
.spec-frame{ position:relative; }
.spec-frame::before, .spec-frame::after{
  content:'';
  position:absolute;
  width:22px; height:22px;
  border:2px solid var(--primary);
  opacity:.9;
}
.spec-frame::before{ top:-10px; left:-10px; border-right:none; border-bottom:none; }
.spec-frame::after{ bottom:-10px; right:-10px; border-left:none; border-top:none; }

.btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:16px 30px;
  font-weight:700;
  font-size:14px;
  letter-spacing:.03em;
  text-transform:uppercase;
  border-radius:2px;
  border:2px solid transparent;
  transition:transform .35s var(--ease), background .35s var(--ease), color .35s var(--ease), border-color .35s var(--ease);
  white-space:nowrap;
}
.btn-primary{ background:var(--primary); color:var(--dark); }
.btn-primary:hover{ background:var(--accent); color:var(--white); transform:translateY(-3px); }
.btn-outline{ border-color:rgba(255,255,255,.5); color:var(--white); }
.btn-outline:hover{ background:var(--white); color:var(--dark); border-color:var(--white); transform:translateY(-3px); }
.btn-dark{ background:var(--dark); color:var(--white); }
.btn-dark:hover{ background:var(--accent); transform:translateY(-3px); }
.btn-block{ width:100%; justify-content:center; }

/* ============================================================
   ANNOUNCEMENT BAR
   ============================================================ */
#announcement{
  background:var(--dark);
  color:var(--light);
  font-family:var(--font-mono);
  font-size:12.5px;
  letter-spacing:.04em;
  text-align:center;
  padding:9px 16px;
  border-bottom:1px solid var(--line);
}
#announcement strong{ color:var(--primary); font-weight:600; }

/* ============================================================
   HEADER
   ============================================================ */
#site-header{
  position:sticky; top:0; z-index:1000;
  background:rgba(18,16,14,.92);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
  transition:background .3s var(--ease), padding .3s var(--ease);
}
.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 32px;
  max-width:1280px;
  margin:0 auto;
  transition:padding .3s var(--ease);
}
#site-header.scrolled .header-inner{ padding:12px 32px; }
.brand{ display:flex; align-items:center; gap:12px; color:var(--white); }
.brand-mark{
  width:42px; height:42px;
  background:var(--primary);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display);
  color:var(--dark);
  font-size:18px;
  border-radius:2px;
  flex-shrink:0;
}
.brand-name{ font-family:var(--font-heading); font-weight:800; font-size:18px; letter-spacing:-.01em; line-height:1.1; }
.brand-tag{ display:block; font-family:var(--font-mono); font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--primary); margin-top:2px; }

.main-nav{ display:flex; align-items:center; gap:34px; }
.main-nav a{
  color:rgba(255,255,255,.78);
  font-size:14px;
  font-weight:600;
  letter-spacing:.01em;
  position:relative;
  padding:6px 0;
  transition:color .25s;
}
.main-nav a::after{
  content:''; position:absolute; left:0; bottom:0; width:0; height:2px; background:var(--primary);
  transition:width .3s var(--ease);
}
.main-nav a:hover, .main-nav a.active{ color:var(--white); }
.main-nav a:hover::after, .main-nav a.active::after{ width:100%; }

.header-actions{ display:flex; align-items:center; gap:22px; }
.header-phone{ display:flex; align-items:center; gap:10px; color:var(--white); }
.header-phone i{ color:var(--primary); font-size:16px; }
.header-phone-text{ display:flex; flex-direction:column; line-height:1.2; }
.header-phone-label{ font-size:10px; color:rgba(255,255,255,.5); text-transform:uppercase; letter-spacing:.1em; }
.header-phone-num{ font-weight:700; font-size:14px; }

.hamburger{
  display:none;
  flex-direction:column; gap:5px;
  background:none; border:none; padding:8px;
}
.hamburger span{ width:24px; height:2px; background:var(--white); transition:transform .3s, opacity .3s; }
.hamburger.open span:nth-child(1){ transform:translateY(7px) rotate(45deg); }
.hamburger.open span:nth-child(2){ opacity:0; }
.hamburger.open span:nth-child(3){ transform:translateY(-7px) rotate(-45deg); }

@media (max-width:1024px){
  .main-nav{ position:fixed; top:0; right:-100%; height:100vh; width:78%; max-width:340px;
    background:var(--dark-2); flex-direction:column; align-items:flex-start; justify-content:center;
    padding:40px; gap:26px; transition:right .4s var(--ease); border-left:1px solid var(--line); z-index:1100;}
  .main-nav.open{ right:0; }
  .main-nav a{ font-size:18px; }
  .header-phone-text{ display:none; }
  .hamburger{ display:flex; }
  .nav-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); opacity:0; pointer-events:none; transition:opacity .3s; z-index:1050; }
  .nav-overlay.open{ opacity:1; pointer-events:auto; }
}
@media (max-width:560px){
  .header-quote-btn{ display:none; }
}

/* ============================================================
   HERO
   ============================================================ */
#hero{
  position:relative;
  min-height:92vh;
  display:flex;
  align-items:flex-end;
  background:var(--dark);
  overflow:hidden;
  color:var(--white);
}
.hero-bg{
  position:absolute; inset:0;
  background-size:cover; background-position:center;
}
.hero-bg::after{
  content:'';
  position:absolute; inset:0;
  background:
    linear-gradient(180deg, rgba(18,16,14,.55) 0%, rgba(18,16,14,.55) 40%, rgba(18,16,14,.96) 100%),
    linear-gradient(90deg, rgba(18,16,14,.85) 0%, rgba(18,16,14,.25) 55%);
}
.hero-inner{
  position:relative; z-index:2;
  max-width:1280px; margin:0 auto; width:100%;
  padding:170px 32px 100px;
}
@media (max-width:768px){ .hero-inner{ padding:150px 20px 70px; } }

.hero-eyebrow{
  font-family:var(--font-mono);
  font-size:13px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--primary); font-weight:600; margin-bottom:22px;
  display:flex; align-items:center; gap:12px;
}
.hero-eyebrow::before{ content:''; width:34px; height:2px; background:var(--primary); }

.hero-title{
  font-family:var(--font-heading);
  font-weight:800;
  font-size:clamp(38px, 6.4vw, 84px);
  line-height:0.98;
  letter-spacing:-.02em;
  max-width:900px;
}
.hero-title em{ font-style:normal; color:var(--primary); }

.hero-subtitle{
  margin-top:26px;
  font-size:17px;
  line-height:1.75;
  color:rgba(255,255,255,.78);
  max-width:520px;
}
.hero-actions{ display:flex; gap:18px; margin-top:42px; flex-wrap:wrap; }

.hero-meta{
  display:flex; gap:44px; margin-top:64px; flex-wrap:wrap;
  border-top:1px solid rgba(255,255,255,.16);
  padding-top:32px;
}
.hero-meta-item{ display:flex; align-items:center; gap:14px; }
.hero-meta-icon{ color:var(--primary); font-size:22px; }
.hero-meta-num{ font-family:var(--font-heading); font-weight:800; font-size:22px; line-height:1; }
.hero-meta-label{ font-size:12.5px; color:rgba(255,255,255,.6); margin-top:4px; }

/* diagonal steel-plate divider signature */
.hero-plate{
  position:absolute; right:0; bottom:0; top:0; width:38%;
  z-index:1;
  clip-path: polygon(28% 0, 100% 0, 100% 100%, 0% 100%);
  background: linear-gradient(160deg, rgba(244,166,35,.14), rgba(232,93,44,.1));
  border-left:1px solid rgba(255,255,255,.08);
  display:none;
}
@media (min-width:1100px){ .hero-plate{ display:block; } }

/* ============================================================
   STATS STRIP
   ============================================================ */
#stats{ background:var(--dark-2); color:var(--white); position:relative; }
.stats-grid{
  display:grid; grid-template-columns:repeat(4, 1fr);
  padding:60px 0;
}
.stat-item{
  text-align:center; padding:0 20px;
  border-right:1px solid var(--line);
}
.stat-item:last-child{ border-right:none; }
.stat-num{
  font-family:var(--font-heading); font-weight:800;
  font-size:clamp(30px, 4vw, 48px); color:var(--primary); line-height:1;
}
.stat-label{ margin-top:12px; font-size:13px; color:rgba(255,255,255,.65); letter-spacing:.02em; }
@media (max-width:768px){
  .stats-grid{ grid-template-columns:repeat(2,1fr); gap:36px 0; padding:48px 0; }
  .stat-item{ border-right:none; border-bottom:1px solid var(--line); padding-bottom:24px; }
  .stat-item:nth-child(odd){ border-right:1px solid var(--line); }
  .stat-item:nth-last-child(-n+2){ border-bottom:none; }
}

/* ============================================================
   ABOUT
   ============================================================ */
#about .about-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:80px; align-items:center;
}
.about-media{ position:relative; }
.about-media img{ width:100%; height:560px; object-fit:cover; border-radius:2px; }
.about-media-tag{
  position:absolute; bottom:-24px; left:-24px;
  background:var(--primary); color:var(--dark);
  padding:22px 26px; border-radius:2px;
  font-family:var(--font-heading); font-weight:800;
}
.about-media-tag .n{ font-size:30px; line-height:1; }
.about-media-tag .l{ font-size:11px; font-family:var(--font-mono); letter-spacing:.08em; text-transform:uppercase; margin-top:6px; font-weight:600; }

.about-body p{ font-size:16px; line-height:1.8; color:var(--steel); margin-top:20px; }
.about-pillars{ display:grid; grid-template-columns:1fr 1fr; gap:24px; margin-top:36px; }
.about-pillar{ border-left:2px solid var(--primary); padding-left:16px; }
.about-pillar h4{ font-family:var(--font-heading); font-weight:700; font-size:15px; color:var(--dark); margin-bottom:6px; }
.about-pillar p{ margin-top:0; font-size:14px; }

@media (max-width:900px){
  #about .about-grid{ grid-template-columns:1fr; gap:56px; }
  .about-media img{ height:380px; }
  .about-pillars{ grid-template-columns:1fr; }
}

/* ============================================================
   SERVICES
   ============================================================ */
#services{ background:var(--white); }
.services-grid{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:2px;
  background:var(--line-dark);
  border:1px solid var(--line-dark);
}
.service-card{
  background:var(--white);
  padding:40px 30px;
  position:relative;
  transition:background .35s var(--ease);
  overflow:hidden;
}
.service-card::before{
  content:''; position:absolute; left:0; top:0; height:3px; width:0;
  background:var(--primary); transition:width .4s var(--ease);
}
.service-card:hover::before{ width:100%; }
.service-card:hover{ background:var(--dark); }
.service-card:hover .service-title{ color:var(--white); }
.service-card:hover .service-title{ color:var(--white); }
.service-card:hover .service-desc{ color:rgba(255,255,255,.68); }
.service-card:hover .service-icon{ color:var(--primary); }
.service-icon{ font-size:28px; color:var(--accent); transition:color .35s; }
.service-title{ font-family:var(--font-heading); font-weight:700; font-size:18px; margin-top:22px; color:var(--dark); transition:color .35s; }
.service-desc{ font-size:14px; line-height:1.65; color:var(--steel); margin-top:12px; transition:color .35s; }

@media (max-width:1024px){ .services-grid{ grid-template-columns:repeat(2,1fr); } }
@media (max-width:560px){ .services-grid{ grid-template-columns:1fr; } }

/* ============================================================
   PROJECTS
   ============================================================ */
#projects{ background:var(--light); }
.project-filters{
  display:flex; gap:10px; flex-wrap:wrap; margin-bottom:44px;
  overflow-x:auto; -webkit-overflow-scrolling:touch;
  padding-bottom:4px;
}
.filter-btn{
  background:transparent; border:1.5px solid var(--line-dark);
  padding:10px 22px; font-size:13px; font-weight:700; letter-spacing:.03em;
  text-transform:uppercase; color:var(--steel); border-radius:2px;
  transition:all .3s var(--ease); flex-shrink:0;
}
.filter-btn:hover{ border-color:var(--accent); color:var(--accent); }
.filter-btn.active{ background:var(--dark); border-color:var(--dark); color:var(--white); }

.projects-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:30px; }
.project-card{
  position:relative; border-radius:2px; overflow:hidden;
  height:400px; background:var(--dark);
  transition:transform .3s var(--ease);
}
.project-card:hover{ transform:translateY(-6px); }
.project-card img{ width:100%; height:100%; object-fit:cover; transition:transform .6s var(--ease); }
.project-card:hover img{ transform:scale(1.08); }
.project-overlay{
  position:absolute; inset:0;
  background:linear-gradient(180deg, transparent 40%, rgba(18,16,14,.95) 100%);
  display:flex; flex-direction:column; justify-content:flex-end; padding:28px;
  color:var(--white);
}
.project-cat{
  align-self:flex-start;
  background:var(--primary); color:var(--dark);
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
  padding:5px 12px; border-radius:2px; margin-bottom:14px;
}
.project-title{ font-family:var(--font-heading); font-weight:700; font-size:19px; }
.project-meta{ font-size:13px; color:rgba(255,255,255,.7); margin-top:8px; display:flex; gap:14px; }

@media (max-width:900px){ .projects-grid{ grid-template-columns:1fr 1fr; } }
@media (max-width:600px){ .projects-grid{ grid-template-columns:1fr; } .project-card{ height:320px; } }

/* ============================================================
   WHY US
   ============================================================ */
#why-us{ background:var(--dark); color:var(--white); }
#why-us .section-heading{ color:var(--white); }
.why-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:36px; }
.why-item{ padding:28px 0; border-top:2px solid var(--line); }
.why-icon{ font-size:26px; color:var(--primary); }
.why-title{ font-family:var(--font-heading); font-weight:700; font-size:17px; margin-top:18px; }
.why-desc{ font-size:14px; color:rgba(255,255,255,.62); line-height:1.65; margin-top:10px; }
@media (max-width:900px){ .why-grid{ grid-template-columns:1fr 1fr; } }
@media (max-width:560px){ .why-grid{ grid-template-columns:1fr; } }

/* ============================================================
   PROCESS (blueprint spec-sheet timeline)
   ============================================================ */
#process{ background:var(--white); }
.process-track{ position:relative; }
.process-track::before{
  content:''; position:absolute; top:26px; left:0; right:0; height:1px;
  background:repeating-linear-gradient(90deg, var(--line-dark) 0 8px, transparent 8px 16px);
}
.process-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:20px; position:relative; }
.process-item{ position:relative; padding-top:56px; }
.process-tick{
  position:absolute; top:0; left:0;
  width:52px; height:52px; border-radius:50%;
  background:var(--white); border:2px solid var(--dark);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-weight:700; font-size:14px; color:var(--dark);
  z-index:1;
}
.process-item:hover .process-tick{ background:var(--primary); border-color:var(--primary); }
.process-title{ font-family:var(--font-heading); font-weight:700; font-size:15.5px; color:var(--dark); margin-top:6px; }
.process-desc{ font-size:13px; color:var(--steel); line-height:1.6; margin-top:8px; }
@media (max-width:1024px){
  .process-grid{ grid-template-columns:repeat(3,1fr); row-gap:44px; }
  .process-track::before{ display:none; }
}
@media (max-width:640px){ .process-grid{ grid-template-columns:1fr 1fr; } }

/* ============================================================
   INDUSTRIES
   ============================================================ */
#industries{ background:var(--light); }
.industries-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:22px; }
.industry-card{
  background:var(--white); border:1px solid var(--line-dark);
  padding:32px 24px; text-align:center; border-radius:2px;
  transition:border-color .3s, transform .3s var(--ease);
}
.industry-card:hover{ border-color:var(--primary); transform:translateY(-4px); }
.industry-icon{ font-size:30px; color:var(--accent); }
.industry-title{ font-family:var(--font-heading); font-weight:700; font-size:15px; margin-top:16px; color:var(--dark); }
@media (max-width:900px){ .industries-grid{ grid-template-columns:repeat(2,1fr); } }

/* ============================================================
   CERTIFICATIONS
   ============================================================ */
#certifications{ background:var(--dark-2); color:var(--white); border-top:1px solid var(--line); border-bottom:1px solid var(--line); }
.cert-row{ display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:36px; padding:56px 0; }
.cert-item{ display:flex; align-items:center; gap:14px; opacity:.85; }
.cert-item i{ font-size:26px; color:var(--primary); }
.cert-name{ font-family:var(--font-heading); font-weight:700; font-size:14.5px; }
.cert-sub{ font-size:11.5px; color:rgba(255,255,255,.5); margin-top:2px; }

/* ============================================================
   TESTIMONIALS
   ============================================================ */
#testimonials{ background:var(--white); }
.testi-slide{
  background:var(--light); border:1px solid var(--line-dark);
  border-radius:2px; padding:40px; height:100%;
}
.testi-stars{ color:var(--primary); font-size:14px; letter-spacing:2px; }
.testi-quote{ font-size:16px; line-height:1.75; color:var(--text); margin-top:20px; min-height:120px; }
.testi-person{ display:flex; align-items:center; gap:14px; margin-top:28px; }
.testi-person img{ width:52px; height:52px; border-radius:50%; object-fit:cover; }
.testi-name{ font-family:var(--font-heading); font-weight:700; font-size:15px; }
.testi-company{ font-size:12.5px; color:var(--steel); }
.swiper-pagination-bullet{ background:var(--steel); opacity:.4; }
.swiper-pagination-bullet-active{ background:var(--accent); opacity:1; }

/* ============================================================
   GALLERY
   ============================================================ */
#gallery{ background:var(--light); }
.gallery-grid{
  display:grid; grid-template-columns:repeat(4, 1fr); grid-auto-rows:180px; gap:10px;
}
.gallery-item{
  position:relative; overflow:hidden; border-radius:2px; cursor:pointer;
}
.gallery-item.big{ grid-column:span 2; grid-row:span 2; }
.gallery-item img{ width:100%; height:100%; object-fit:cover; transition:transform .5s var(--ease); }
.gallery-item:hover img{ transform:scale(1.1); }
.gallery-overlay{
  position:absolute; inset:0; background:rgba(18,16,14,0); display:flex; align-items:center; justify-content:center;
  transition:background .3s;
}
.gallery-item:hover .gallery-overlay{ background:rgba(18,16,14,.45); }
.gallery-overlay i{ color:var(--white); font-size:22px; opacity:0; transition:opacity .3s; }
.gallery-item:hover .gallery-overlay i{ opacity:1; }
@media (max-width:768px){
  .gallery-grid{ grid-template-columns:repeat(2,1fr); grid-auto-rows:150px; }
  .gallery-item.big{ grid-column:span 2; grid-row:span 1; height:150px;}
}

.lightbox{
  position:fixed; inset:0; background:rgba(10,9,8,.95); z-index:2000;
  display:none; align-items:center; justify-content:center; padding:40px;
}
.lightbox.open{ display:flex; }
.lightbox img{ max-width:90vw; max-height:85vh; object-fit:contain; border-radius:2px; }
.lightbox-close{
  position:absolute; top:24px; right:32px; background:none; border:none;
  color:var(--white); font-size:28px;
}

/* ============================================================
   FAQ
   ============================================================ */
#faq{ background:var(--white); }
.faq-wrap{ max-width:820px; margin:0 auto; }
.faq-item{ border-bottom:1px solid var(--line-dark); }
.faq-q{
  display:flex; justify-content:space-between; align-items:center; gap:20px;
  padding:24px 4px; background:none; border:none; width:100%; text-align:left;
  font-family:var(--font-heading); font-weight:700; font-size:16px; color:var(--dark);
}
.faq-q i{ color:var(--accent); transition:transform .3s var(--ease); flex-shrink:0; }
.faq-item.open .faq-q i{ transform:rotate(45deg); }
.faq-a{ max-height:0; overflow:hidden; transition:max-height .35s var(--ease); }
.faq-a-inner{ padding:0 4px 24px; font-size:14.5px; line-height:1.75; color:var(--steel); }

/* ============================================================
   QUOTE / CONTACT
   ============================================================ */
#contact{
  background:var(--dark); color:var(--white); position:relative; overflow:hidden;
}
.contact-grid{ display:grid; grid-template-columns:1fr 1fr; gap:70px; }
#contact .section-heading{ color:var(--white); }
.contact-info-item{ display:flex; gap:18px; margin-top:28px; }
.contact-info-icon{
  width:46px; height:46px; background:rgba(255,255,255,.06); border:1px solid var(--line);
  display:flex; align-items:center; justify-content:center; border-radius:2px; flex-shrink:0; color:var(--primary);
}
.contact-info-label{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:rgba(255,255,255,.5); }
.contact-info-value{ font-weight:600; margin-top:4px; }
.social-row{ display:flex; gap:12px; margin-top:36px; }
.social-row a{
  width:40px; height:40px; border:1px solid var(--line); border-radius:50%;
  display:flex; align-items:center; justify-content:center; color:var(--white);
  transition:background .3s, border-color .3s;
}
.social-row a:hover{ background:var(--primary); border-color:var(--primary); color:var(--dark); }

.quote-form{ background:var(--white); border-radius:3px; padding:40px; color:var(--text); }
.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.form-group{ margin-bottom:18px; }
.form-group label{ display:block; font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; margin-bottom:8px; color:var(--dark); }
.form-group input, .form-group select, .form-group textarea{
  width:100%; border:1.5px solid var(--line-dark); border-radius:2px; padding:13px 14px;
  font-family:var(--font-body); font-size:14.5px; background:var(--light); transition:border-color .25s;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{ border-color:var(--accent); outline:none; }
.form-group textarea{ resize:vertical; min-height:100px; }
.form-error{ font-size:12px; color:var(--accent); margin-top:6px; display:none; }
.form-group.error input, .form-group.error select, .form-group.error textarea{ border-color:var(--accent); }
.form-group.error .form-error{ display:block; }
.form-success{
  display:none; background:#F0F8F0; border:1px solid #8FCB8F; color:#2C6E2C;
  padding:16px 18px; border-radius:2px; font-size:14px; margin-bottom:20px; align-items:center; gap:10px;
}
.form-success.show{ display:flex; }
@media (max-width:900px){ .contact-grid{ grid-template-columns:1fr; gap:48px; } }
@media (max-width:560px){ .form-row{ grid-template-columns:1fr; } .quote-form{ padding:26px; } }

/* ============================================================
   FOOTER
   ============================================================ */
#site-footer{ background:#0D0B0A; color:rgba(255,255,255,.7); padding:70px 0 0; }
.footer-grid{ display:grid; grid-template-columns:1.6fr 1fr 1fr 1.2fr; gap:50px; padding-bottom:56px; border-bottom:1px solid var(--line); }
.footer-brand-name{ color:var(--white); font-family:var(--font-heading); font-weight:800; font-size:19px; }
.footer-desc{ font-size:13.5px; line-height:1.75; margin-top:16px; max-width:280px; }
.footer-col-title{ color:var(--white); font-family:var(--font-heading); font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:.05em; margin-bottom:20px; }
.footer-col li{ margin-bottom:12px; font-size:14px; }
.footer-col a:hover{ color:var(--primary); }
.footer-contact-item{ display:flex; gap:10px; margin-bottom:14px; font-size:13.5px; }
.footer-contact-item i{ color:var(--primary); margin-top:3px; }
.footer-bottom{ display:flex; justify-content:space-between; align-items:center; padding:26px 0; flex-wrap:wrap; gap:14px; font-size:12.5px; }
.footer-bottom .social-row a{ width:34px; height:34px; }
@media (max-width:900px){ .footer-grid{ grid-template-columns:1fr 1fr; gap:40px; } }
@media (max-width:560px){ .footer-grid{ grid-template-columns:1fr; } }

/* ============================================================
   FLOATING ACTIONS
   ============================================================ */
.floating-actions{ position:fixed; right:22px; bottom:22px; z-index:900; display:flex; flex-direction:column; gap:12px; }
.fab{
  width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  color:var(--white); font-size:22px; box-shadow:0 8px 24px rgba(0,0,0,.3);
  transition:transform .3s var(--ease);
}
.fab:hover{ transform:scale(1.1); }
.fab-whatsapp{ background:#25D366; }
.fab-call{ background:var(--accent); }
.fab-top{
  background:var(--dark); opacity:0; pointer-events:none; transform:translateY(10px);
  transition:opacity .3s, transform .3s;
}
.fab-top.show{ opacity:1; pointer-events:auto; transform:translateY(0); }

/* ============================================================
   AOS OVERRIDE - subtlety
   ============================================================ */
[data-aos]{ pointer-events:auto; }

/* error state */
#config-error{
  display:none; min-height:100vh; align-items:center; justify-content:center; flex-direction:column;
  text-align:center; padding:40px; font-family:var(--font-body);
}
#config-error.show{ display:flex; }

/* skip link */
.skip-link{
  position:absolute; left:-999px; top:0; background:var(--primary); color:var(--dark); padding:12px 20px; z-index:3000; font-weight:700;
}
.skip-link:focus{ left:16px; top:16px; }
</style>

<!-- ================= APPLICATION LOGIC ================= -->
<script>
(function(){
  "use strict";

  /* ---------- Load & validate JSON ---------- */
  let data;
  try{
    const raw = document.getElementById('website-data').textContent;
    data = JSON.parse(raw);
    const requiredTop = ['company','navigation','hero','stats','about','services','projects','whyUs','process','industries','certifications','testimonials','gallery','faq','contact','socialLinks','theme','sectionVisibility'];
    requiredTop.forEach(function(k){ if(!(k in data)) throw new Error('Missing key: '+k); });
  }catch(e){
    console.error('Website data error:', e);
    document.getElementById('config-error').classList.add('show');
    document.getElementById('app').style.display = 'none';
    return;
  }

  const esc = function(str){
    if(str === undefined || str === null) return '';
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  };
  const visible = function(key){ return !!(data.sectionVisibility && data.sectionVisibility[key]); };

  /* ---------- Theme -> CSS variables ---------- */
  (function applyTheme(){
    const t = data.theme || {};
    const root = document.documentElement.style;
    if(t.primary) root.setProperty('--primary', t.primary);
    if(t.accent) root.setProperty('--accent', t.accent);
    if(t.dark) root.setProperty('--dark', t.dark);
    if(t.darkSecondary) root.setProperty('--dark-2', t.darkSecondary);
    if(t.light) root.setProperty('--light', t.light);
    if(t.white) root.setProperty('--white', t.white);
    if(t.text) root.setProperty('--text', t.text);
    if(t.steel) root.setProperty('--steel', t.steel);
  })();

  /* ---------- SEO / head ---------- */
  (function applySEO(){
    const seo = data.seo || {};
    if(seo.title){ document.title = seo.title; }
    const metaTags = [
      { name:'description', content: seo.description },
      { name:'keywords', content: (seo.keywords||[]).join(', ') },
      { property:'og:title', content: seo.title },
      { property:'og:description', content: seo.description },
      { property:'og:image', content: seo.ogImage },
      { property:'og:type', content: 'website' }
    ];
    metaTags.forEach(function(m){
      if(!m.content) return;
      const tag = document.createElement('meta');
      if(m.name) tag.setAttribute('name', m.name);
      if(m.property) tag.setAttribute('property', m.property);
      tag.setAttribute('content', m.content);
      document.head.appendChild(tag);
    });
  })();

  /* ================= RENDERERS ================= */

  function renderAnnouncement(){
    if(!visible('announcement') || !data.announcement) return '';
    return '<div id="announcement">'+ data.announcement.replace(/<(?!\/?strong)[^>]*>/g,'') +'</div>';
  }

  function renderHeader(){
    const c = data.company;
    const navHtml = (data.navigation||[]).map(function(item){
      return '<a href="'+esc(item.target)+'" class="nav-link">'+esc(item.label)+'</a>';
    }).join('');
    return ''+
    '<header id="site-header">'+
      '<div class="header-inner">'+
        '<a href="#home" class="brand" aria-label="'+esc(c.name)+' home">'+
          '<div class="brand-mark">'+esc(c.logoInitials||'')+'</div>'+
          '<div><div class="brand-name">'+esc(c.name)+'</div><span class="brand-tag">'+esc(c.tagline)+'</span></div>'+
        '</a>'+
        '<nav class="main-nav" id="main-nav" aria-label="Primary">'+ navHtml +'</nav>'+
        '<div class="header-actions">'+
          '<a href="tel:'+esc(c.phone)+'" class="header-phone">'+
            '<i class="fa-solid fa-phone-volume" aria-hidden="true"></i>'+
            '<span class="header-phone-text"><span class="header-phone-label">Call us</span><span class="header-phone-num">'+esc(c.phoneDisplay||c.phone)+'</span></span>'+
          '</a>'+
          '<a href="#contact" class="btn btn-primary header-quote-btn">Get a Quote</a>'+
          '<button class="hamburger" id="hamburger" aria-label="Toggle menu" aria-expanded="false" aria-controls="main-nav">'+
            '<span></span><span></span><span></span>'+
          '</button>'+
        '</div>'+
      '</div>'+
    '</header>'+
    '<div class="nav-overlay" id="nav-overlay"></div>';
  }

  function renderHero(){
    if(!visible('hero')) return '';
    const h = data.hero;
    const metaHtml = (h.meta||[]).map(function(m){
      return '<div class="hero-meta-item"><i class="'+esc(m.icon)+' hero-meta-icon" aria-hidden="true"></i>'+
        '<div><div class="hero-meta-num">'+esc(m.num)+'</div><div class="hero-meta-label">'+esc(m.label)+'</div></div></div>';
    }).join('');
    return ''+
    '<section id="home">'+
      '<div id="hero">'+
        '<div class="hero-bg" style="background-image:url(\''+esc(h.backgroundImage)+'\')" role="img" aria-label="Construction site"></div>'+
        '<div class="hero-plate" aria-hidden="true"></div>'+
        '<div class="hero-inner">'+
          '<p class="hero-eyebrow">'+esc(h.eyebrow)+'</p>'+
          '<h1 class="hero-title">'+esc(h.titleLine1)+'<br>'+esc(h.titleLine2)+'<br><em>'+esc(h.titleLine3)+'</em></h1>'+
          '<p class="hero-subtitle">'+esc(h.subtitle)+'</p>'+
          '<div class="hero-actions">'+
            '<a href="#contact" class="btn btn-primary">'+esc(h.ctaPrimary)+'</a>'+
            '<a href="#projects" class="btn btn-outline">'+esc(h.ctaSecondary)+'</a>'+
          '</div>'+
          '<div class="hero-meta">'+ metaHtml +'</div>'+
        '</div>'+
      '</div>'+
    '</section>';
  }

  function renderStats(){
    if(!visible('stats')) return '';

        '<div class="stat-num" data-count="'+esc(s.number)+'" data-suffix="'+esc(s.suffix||'')+'">0'+esc(s.suffix||'')+'</div>'+
        '<div class="stat-label">'+esc(s.label)+'</div></div>';
    }).join('');
    return '<section id="stats"><div class="container"><div class="stats-grid">'+items+'</div></div></section>';
  }

  function renderAbout(){
    if(!visible('about')) return '';
    const a = data.about;
    const pillars = (a.pillars||[]).map(function(p){
      return '<div class="about-pillar"><h4>'+esc(p.title)+'</h4><p>'+esc(p.text)+'</p></div>';
    }).join('');
    return ''+
    '<section id="about" class="pad">'+
      '<div class="container">'+
        '<div class="about-grid">'+
          '<div class="about-media spec-frame" data-aos="fade-right">'+
            '<img src="'+esc(a.image)+'" alt="Ironclad Structures team on site" loading="lazy">'+
            '<div class="about-media-tag"><div class="n">'+esc(data.company.experience)+'</div><div class="l">In Operation</div></div>'+
          '</div>'+
          '<div class="about-body" data-aos="fade-left">'+
            '<div class="section-label">'+esc(a.label)+'</div>'+

            '<div class="about-pillars">'+pillars+'</div>'+
            '<div style="margin-top:36px;"><a href="#process" class="btn btn-dark">'+esc(a.cta)+'</a></div>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</section>';
  }

  function renderServices(){
    if(!visible('services')) return '';
    function renderService(s, i){
      return '<div class="service-card" data-aos="fade-up" data-aos-delay="'+((i%4)*70)+'">'+
        '<i class="'+esc(s.icon)+' service-icon" aria-hidden="true"></i>'+
        '<h3 class="service-title">'+esc(s.title)+'</h3>'+
        '<p class="service-desc">'+esc(s.description)+'</p>'+

    }
    const cards = (data.services||[]).map(renderService).join('');
    return ''+
    '<section id="services" class="pad">'+
      '<div class="container">'+
        '<div class="section-head center">'+
          '<div class="section-label" style="justify-content:center;">What We Do</div>'+
          '<h2 class="section-heading">Services engineered around scope, not templates</h2>'+
          '<p class="section-sub">Every service below is delivered by our own crews and reviewed by our in-house structural engineers &mdash; no unmanaged subcontracting.</p>'+
        '</div>'+
      '</div>'+
      '<div class="container" style="padding-left:0;padding-right:0;max-width:1280px;">'+
        '<div class="services-grid">'+cards+'</div>'+
      '</div>'+
    '</section>';
  }

  function renderProjects(){
    if(!visible('projects')) return '';
    const projects = data.projects||[];
    const categories = ['All'].concat(Array.from(new Set(projects.map(function(p){return p.category;}))));
    const filterBtns = categories.map(function(cat, i){
      return '<button class="filter-btn'+(i===0?' active':'')+'" data-filter="'+esc(cat)+'">'+esc(cat)+'</button>';

          '<h3 class="project-title">'+esc(p.title)+'</h3>'+

        '</div>'+
      '</div>';
    }).join('');
    return ''+
    '<section id="projects" class="pad">'+
      '<div class="container">'+
        '<div class="section-head">'+
          '<div class="section-label">Featured Work</div>'+
          '<h2 class="section-heading">A portfolio you can drive past</h2>'+
        '</div>'+
        '<div class="project-filters" role="group" aria-label="Filter projects by category">'+filterBtns+'</div>'+
        '<div class="projects-grid" id="projects-grid">'+cards+'</div>'+
      '</div>'+
    '</section>';
  }

  function renderWhyUs(){
    if(!visible('whyUs')) return '';
    const items = (data.whyUs||[]).map(function(w, i){
      return '<div class="why-item" data-aos="fade-up" data-aos-delay="'+((i%4)*70)+'">'+
        '<i class="'+esc(w.icon)+' why-icon" aria-hidden="true"></i>'+

        '<p class="why-desc">'+esc(w.text)+'</p>'+

        '<div class="section-head">'+
          '<div class="section-label">Why Ironclad</div>'+

        '</div>'+
        '<div class="why-grid">'+items+'</div>'+
      '</div>'+
    '</section>';
  }

  function renderProcess(){
    if(!visible('process')) return '';
    const items = (data.process||[]).map(function(p, i){
      const n = String(i+1).padStart(2,'0');
      return '<div class="process-item" data-aos="fade-up" data-aos-delay="'+(i*70)+'">'+
        '<div class="process-tick">'+n+'</div>'+
        '<h3 class="process-title">'+esc(p.title)+'</h3>'+
        '<p class="process-desc">'+esc(p.description)+'</p>'+
      '</div>';
    }).join('');
    return ''+
    '<section id="process" class="pad">'+
      '<div class="container">'+
        '<div class="section-head">'+
          '<div class="section-label">Build Sequence</div>'+
          '<h2 class="section-heading">Six checkpoints, no skipped steps</h2>'+
        '</div>'+
        '<div class="process-track"><div class="process-grid">'+items+'</div></div>'+
      '</div>'+
    '</section>';
  }

  function renderIndustries(){
    if(!visible('industries')) return '';

      return '<div class="industry-card" data-aos="zoom-in" data-aos-delay="'+((i%4)*60)+'">'+
        '<i class="'+esc(ind.icon)+' industry-icon" aria-hidden="true"></i>'+
        '<div class="industry-title">'+esc(ind.title)+'</div>'+
      '</div>';
    }).join('');
    return ''+
    '<section id="industries" class="pad">'+
      '<div class="container">'+
        '<div class="section-head center">'+
          '<div class="section-label" style="justify-content:center;">Sectors We Serve</div>'+
          '<h2 class="section-heading">Built across every occupancy type</h2>'+
        '</div>'+
        '<div class="industries-grid">'+items+'</div>'+
      '</div>'+
    '</section>';
  }

  function renderCertifications(){
    if(!visible('certifications')) return '';
    const items = (data.certifications||[]).map(function(c){
      return '<div class="cert-item"><i class="'+esc(c.icon)+'" aria-hidden="true"></i>'+
        '<div><div class="cert-name">'+esc(c.name)+'</div><div class="cert-sub">'+esc(c.sub)+'</div></div></div>';
    }).join('');
    return '<section id="certifications"><div class="container"><div class="cert-row">'+items+'</div></div></section>';
  }

  function renderTestimonials(){
    if(!visible('testimonials')) return '';
    const slides = (data.testimonials||[]).map(function(t){
      const stars = Array.from({length:5}).map(function(_,i){ return '<i class="'+(i < t.rating ? 'fa-solid':'fa-regular')+' fa-star"></i>'; }).join('');
      return '<div class="swiper-slide"><div class="testi-slide">'+
        '<div class="testi-stars">'+stars+'</div>'+
        '<p class="testi-quote">&ldquo;'+esc(t.review)+'&rdquo;</p>'+
        '<div class="testi-person"><img src="'+esc(t.image)+'" alt="'+esc(t.name)+'" loading="lazy">'+
        '<div><div class="testi-name">'+esc(t.name)+'</div><div class="testi-company">'+esc(t.company)+'</div></div></div>'+

    }).join('');

    '<section id="testimonials" class="pad">'+

      return '<div class="gallery-item'+(g.big?' big':'')+'" data-full="'+esc(g.image)+'" data-alt="'+esc(g.alt||'')+'" tabindex="0" role="button" aria-label="View larger image: '+esc(g.alt||'')+'">'+

              '</div>'+
              '<div class="form-row">'+
                '<div class="form-group"><label for="f-type">Project Type</label><select id="f-type" name="projectType"><option value="">Select one</option>'+typeOptions+'</select><div class="form-error">Please select a project type.</div></div>'+
                '<div class="form-group"><label for="f-budget">Estimated Budget</label><select id="f-budget" name="budget"><option value="">Select one</option>'+budgetOptions+'</select></div>'+
              '</div>'+
              '<div class="form-group"><label for="f-message">Project Details</label><textarea id="f-message" name="message" placeholder="Location, approximate size, timeline..."></textarea></div>'+
              '<button type="submit" class="btn btn-primary btn-block">Send Request</button>'+
            '</form>'+
          '</div>'+
        '</div>'+
      '</div>'+
    '</section>';
  }

  function renderFooter(){
    const c = data.company;
    const navLinks = (data.navigation||[]).map(function(n){ return '<li><a href="'+esc(n.target)+'">'+esc(n.label)+'</a></li>'; }).join('');
    const serviceLinks = (data.services||[]).slice(0,6).map(function(s){ return '<li><a href="#services">'+esc(s.title)+'</a></li>'; }).join('');
    const socials = (data.socialLinks||[]).map(function(s){
      return '<a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer" aria-label="'+esc(s.platform)+'"><i class="'+esc(s.icon)+'" aria-hidden="true"></i></a>';
    }).join('');
    const year = new Date().getFullYear();
    return ''+
    '<footer id="site-footer">'+
      '<div class="container">'+
        '<div class="footer-grid">'+
          '<div>'+
            '<div class="footer-brand-name">'+esc(c.name)+'</div>'+
            '<p class="footer-desc">'+esc(c.description)+'</p>'+
          '</div>'+
          '<div><div class="footer-col-title">Navigate</div><ul class="footer-col">'+navLinks+'</ul></div>'+
          '<div><div class="footer-col-title">Services</div><ul class="footer-col">'+serviceLinks+'</ul></div>'+
          '<div>'+
            '<div class="footer-col-title">Contact</div>'+
            '<div class="footer-contact-item"><i class="fa-solid fa-location-dot"></i><span>'+esc(c.address)+'</span></div>'+
            '<div class="footer-contact-item"><i class="fa-solid fa-phone"></i><span>'+esc(c.phoneDisplay||c.phone)+'</span></div>'+
            '<div class="footer-contact-item"><i class="fa-solid fa-envelope"></i><span>'+esc(c.email)+'</span></div>'+
          '</div>'+
        '</div>'+
        '<div class="footer-bottom">'+
          '<div>&copy; '+year+' '+esc(c.name)+'. All rights reserved.</div>'+
          '<div class="social-row">'+socials+'</div>'+
        '</div>'+
      '</div>'+
    '</footer>';
  }

  function renderFloatingActions(){
    const qa = data.quickActions || {};
    let html = '<div class="floating-actions">';
    if(qa.whatsapp && qa.whatsapp.enabled){
      const msg = encodeURIComponent(qa.whatsapp.message||'');
      html += '<a class="fab fab-whatsapp" href="https://wa.me/'+esc(qa.whatsapp.number)+'?text='+msg+'" target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp"><i class="fa-brands fa-whatsapp"></i></a>';
    }
    if(qa.call && qa.call.enabled){
      html += '<a class="fab fab-call" href="tel:'+esc(qa.call.number)+'" aria-label="Call us"><i class="fa-solid fa-phone"></i></a>';
    }
    html += '<button class="fab fab-top" id="back-to-top" aria-label="Back to top"><i class="fa-solid fa-arrow-up"></i></button>';
    html += '</div>';
    return html;
  }

  /* ================= ASSEMBLE PAGE ================= */
  const appHtml =
    renderAnnouncement() +
    renderHeader() +
    '<main id="main-content">' +
      renderHero() +
      renderStats() +
      renderAbout() +
      renderServices() +
      renderProjects() +
      renderWhyUs() +
      renderProcess() +
      renderIndustries() +
      renderCertifications() +
      renderTestimonials() +
      renderGallery() +
      renderFAQ() +
      renderContact() +
    '</main>' +
    renderFooter() +
    renderFloatingActions();

  document.getElementById('app').innerHTML = appHtml;

  /* ================= INTERACTIVITY (jQuery) ================= */
  $(function(){

    /* AOS init */
    if(data.animations && data.animations.enabled && window.AOS){
      AOS.init({ duration: data.animations.duration || 700, once: data.animations.once !== false, offset: 60 });
    }

    /* Mobile menu */
    const $hamburger = $('#hamburger');
    const $nav = $('#main-nav');
    const $overlay = $('#nav-overlay');
    function closeMenu(){
      $hamburger.removeClass('open').attr('aria-expanded','false');
      $nav.removeClass('open');
      $overlay.removeClass('open');
    }
    $hamburger.on('click', function(){
      const opening = !$nav.hasClass('open');
      $hamburger.toggleClass('open').attr('aria-expanded', opening);
      $nav.toggleClass('open');
      $overlay.toggleClass('open');
    });
    $overlay.on('click', closeMenu);

    /* Smooth scroll + close mobile menu */
    $(document).on('click', 'a[href^="#"]', function(e){
      const targetSel = $(this).attr('href');
      if(targetSel.length < 2) return;
      const $target = $(targetSel);
      if($target.length){
        e.preventDefault();
        closeMenu();
        $('html, body').animate({ scrollTop: $target.offset().top - 78 }, 600);
      }
    });

    /* Header scroll state */
    const $header = $('#site-header');
    const $backTop = $('#back-to-top');
    $(window).on('scroll', function(){
      const st = $(window).scrollTop();
      $header.toggleClass('scrolled', st > 40);
      $backTop.toggleClass('show', st > 500);
      updateActiveNav();
    });

    /* Active nav on scroll */
    const $sections = $('main section[id]');
    const $navLinks = $('.nav-link');
    function updateActiveNav(){
      const scrollPos = $(window).scrollTop() + 140;
      let currentId = null;
      $sections.each(function(){
        const top = $(this).offset().top;
        const bottom = top + $(this).outerHeight();
        if(scrollPos >= top && scrollPos < bottom){ currentId = '#' + $(this).attr('id'); }
      });
      $navLinks.removeClass('active');
      if(currentId){ $navLinks.filter('[href="'+currentId+'"]').addClass('active'); }
    }
    updateActiveNav();

    /* Back to top */
    $backTop.on('click', function(){
      $('html, body').animate({ scrollTop: 0 }, 600);
    });

    /* Animated counters */
    let countersStarted = false;
    function animateCounters(){
      if(countersStarted) return;
      const $stats = $('#stats');
      if(!$stats.length) return;
      const top = $stats.offset().top;
      if($(window).scrollTop() + $(window).height() > top + 40){
        countersStarted = true;
        $('.stat-num').each(function(){
          const $el = $(this);
          const target = parseFloat($el.data('count'));
          const suffix = $el.data('suffix') || '';
          const isFloat = target % 1 !== 0;
          $({ n: 0 }).animate({ n: target }, {
            duration: 1400,
            easing: 'swing',
            step: function(now){ $el.text((isFloat ? now.toFixed(1) : Math.floor(now)) + suffix); },
            complete: function(){ $el.text((isFloat ? target.toFixed(1) : target) + suffix); }
          });
        });
      }
    }
    $(window).on('scroll', animateCounters);
    animateCounters();

    /* Project filters */
    $('.filter-btn').on('click', function(){
      const filter = $(this).data('filter');
      $('.filter-btn').removeClass('active');
      $(this).addClass('active');
      $('.project-card').each(function(){
        const cat = $(this).data('category');
        const show = (filter === 'All' || cat === filter);
        $(this).stop().animate({ opacity: show ? 1 : 0 }, 250);
        if(show){ $(this).css('display','block'); } else { setTimeout(function(){}, 0); $(this).css('display', show ? 'block':'none'); }
      });
      // re-run after fade to hide
      setTimeout(function(){
        $('.project-card').each(function(){
          const cat = $(this).data('category');
          const show = (filter === 'All' || cat === filter);
          $(this).css('display', show ? 'block' : 'none');
        });
      }, 260);
    });

    /* FAQ accordion */
    $('.faq-q').on('click', function(){
      const $item = $(this).closest('.faq-item');
      const $answer = $item.find('.faq-a');
      const isOpen = $item.hasClass('open');
      $('.faq-item.open').not($item).each(function(){
        $(this).removeClass('open').find('.faq-a').css('max-height', 0);
        $(this).find('.faq-q').attr('aria-expanded','false');
      });
      if(isOpen){
        $item.removeClass('open');
        $answer.css('max-height', 0);
        $(this).attr('aria-expanded','false');
      }else{
        $item.addClass('open');
        $answer.css('max-height', $answer[0].scrollHeight + 'px');
        $(this).attr('aria-expanded','true');
      }
    });

    /* Gallery lightbox */
    const $lightbox = $('#lightbox');
    const $lightboxImg = $('#lightbox-img');
    function openLightbox($item){
      $lightboxImg.attr('src', $item.data('full')).attr('alt', $item.data('alt') || '');
      $lightbox.addClass('open');
    }
    $('.gallery-item').on('click', function(){ openLightbox($(this)); });
    $('.gallery-item').on('keypress', function(e){
      if(e.which === 13 || e.which === 32){ e.preventDefault(); openLightbox($(this)); }
    });
    $('#lightbox-close, .lightbox').on('click', function(e){
      if(e.target.id === 'lightbox-close' || e.target.id === 'lightbox'){ $lightbox.removeClass('open'); }
    });
    $(document).on('keydown', function(e){ if(e.key === 'Escape'){ $lightbox.removeClass('open'); } });

    /* Testimonials swiper */
    if(window.Swiper){
      new Swiper('.testi-swiper', {
        slidesPerView: 1,
        spaceBetween: 24,
        loop: true,
        autoplay: { delay: 5500, disableOnInteraction: false },
        pagination: { el: '.swiper-pagination', clickable: true },
        breakpoints: {
          768: { slidesPerView: 2 },
          1100: { slidesPerView: 3 }
        }
      });
    }

    /* Quote form validation (frontend-only) */
    const requiredFields = (data.contact && data.contact.requiredFields) || ['name','phone','email'];
    $('#quote-form').on('submit', function(e){
      e.preventDefault();
      let valid = true;
      const $form = $(this);
      $form.find('.form-group').removeClass('error');

      function fail($input){
        $input.closest('.form-group').addClass('error');
        valid = false;
      }
      function isEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
      function isPhone(v){ return /^[+]?[\d\s()-]{7,18}$/.test(v); }

      requiredFields.forEach(function(field){
        const $input = $form.find('[name="'+field+'"]');
        if(!$input.length) return;
        const val = $.trim($input.val());
        if(!val){ fail($input); return; }
        if(field === 'email' && !isEmail(val)){ fail($input); }
        if(field === 'phone' && !isPhone(val)){ fail($input); }
      });

      if(!valid){
        $form.find('.form-group.error').first().find('input, select, textarea').trigger('focus');
        return;
      }

      $('#form-success').addClass('show');
      $form[0].reset();
      $('html, body').animate({ scrollTop: $('#form-success').offset().top - 120 }, 400);
    });

  });

})();
</script>

</body>
</html>
