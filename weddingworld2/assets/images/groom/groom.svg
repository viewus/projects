<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 660" width="100%" height="100%">
  <defs>
    <linearGradient id="groomBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2a47"/>
      <stop offset="60%" stop-color="#0c1526"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="goldSheenGroom" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="#8c6a24"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff5d6"/>
      <stop offset="70%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6a24"/>
    </linearGradient>
    <linearGradient id="sherwaniGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffbf2"/>
      <stop offset="60%" stop-color="#f0e2c8"/>
      <stop offset="100%" stop-color="#d8c5a0"/>
    </linearGradient>
  </defs>

  <rect width="500" height="660" fill="url(#groomBg)"/>

  <!-- Ornate Arch -->
  <path d="M 40 620 L 40 240 C 40 120 150 40 250 40 C 350 40 460 120 460 240 L 460 620 Z" 
        fill="none" stroke="url(#goldSheenGroom)" stroke-width="3" opacity="0.8"/>
  <path d="M 55 620 L 55 245 C 55 135 155 55 250 55 C 345 55 445 135 445 245 L 445 620 Z" 
        fill="none" stroke="url(#goldSheenGroom)" stroke-dasharray="4 6" stroke-width="1.5" opacity="0.5"/>

  <!-- Background Mandala -->
  <g transform="translate(250, 240)" opacity="0.15">
    <circle r="150" fill="none" stroke="url(#goldSheenGroom)" stroke-width="2"/>
    <circle r="110" fill="none" stroke="url(#goldSheenGroom)" stroke-dasharray="6 6" stroke-width="1.5"/>
  </g>

  <!-- Groom Illustration -->
  <g transform="translate(150, 110)">
    <!-- Royal Pagdi / Turban with Kalgi -->
    <path d="M 20 80 C 10 45 45 10 100 15 C 145 20 180 55 165 95 C 135 85 55 82 20 80 Z" fill="#9e182b"/>
    <path d="M 25 80 Q 95 65 165 90" fill="none" stroke="url(#goldSheenGroom)" stroke-width="6"/>
    <!-- Royal Kalgi Brooch & Feather -->
    <path d="M 55 25 Q 75 -25 70 -50 Q 55 -20 50 15 Z" fill="url(#goldSheenGroom)"/>
    <circle cx="68" cy="30" r="8" fill="url(#goldSheenGroom)"/>
    <circle cx="68" cy="30" r="4" fill="#0c1526"/>

    <!-- Groom Face & Royal Beard -->
    <path d="M 52 88 Q 50 145 68 172 Q 98 195 128 172 Q 146 145 144 88 Z" fill="#e0bf9f"/>
    <!-- Groom Beard Profile -->
    <path d="M 62 135 Q 98 198 134 135 Q 128 130 98 140 Q 68 130 62 135 Z" fill="#241914"/>

    <!-- Royal Bandhgala / Sherwani -->
    <path d="M -10 195 Q 98 180 206 195 L 225 490 L -30 490 Z" fill="url(#sherwaniGrad)"/>
    <!-- Center Gold Button Placket -->
    <path d="M 98 190 L 98 490" stroke="url(#goldSheenGroom)" stroke-width="10"/>
    <circle cx="98" cy="230" r="4" fill="#6e0b1c"/>
    <circle cx="98" cy="270" r="4" fill="#6e0b1c"/>
    <circle cx="98" cy="310" r="4" fill="#6e0b1c"/>
    <circle cx="98" cy="350" r="4" fill="#6e0b1c"/>

    <!-- Royal Pearl Mala Necklace -->
    <path d="M 35 210 Q 98 310 161 210" fill="none" stroke="#ffffff" stroke-width="6" stroke-dasharray="8 6"/>
    <path d="M 48 210 Q 98 340 148 210" fill="none" stroke="url(#goldSheenGroom)" stroke-width="4"/>
    <!-- Emerald Pendant -->
    <polygon points="98,340 106,352 98,364 90,352" fill="#0b5e40" stroke="url(#goldSheenGroom)" stroke-width="2"/>
  </g>

  <!-- Title Badge -->
  <text x="250" y="580" font-family="'Cinzel', serif" font-size="20" font-weight="700" fill="url(#goldSheenGroom)" text-anchor="middle" letter-spacing="3">
    RAHUL VERMA
  </text>
  <text x="250" y="605" font-family="'Great Vibes', cursive" font-size="24" fill="#faecc3" text-anchor="middle">
    The Royal Groom
  </text>
</svg>
