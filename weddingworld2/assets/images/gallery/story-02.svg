<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="storyBg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a2612"/>
      <stop offset="100%" stop-color="#140b05"/>
    </linearGradient>
    <linearGradient id="goldS2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7a5814"/>
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#storyBg2)"/>
  <rect x="20" y="20" width="460" height="360" rx="12" fill="none" stroke="url(#goldS2)" stroke-width="1.5" opacity="0.6"/>
  <!-- Story Motif: Golden Ring / Proposal -->
  <g transform="translate(250, 190)">
    <circle r="60" fill="none" stroke="url(#goldS2)" stroke-width="8"/>
    <!-- Diamond Solitaire Motif -->
    <polygon points="0,-75 25,-55 18,-45 -18,-45 -25,-55" fill="#ffffff" stroke="url(#goldS2)" stroke-width="2"/>
    <polygon points="0,-75 10,-55 0,-45 -10,-55" fill="rgba(255, 245, 214, 0.7)"/>
    <!-- Sparkle Rays -->
    <line x1="0" y1="-85" x2="0" y2="-100" stroke="url(#goldS2)" stroke-width="2"/>
    <line x1="-25" y1="-75" x2="-38" y2="-88" stroke="url(#goldS2)" stroke-width="2"/>
    <line x1="25" y1="-75" x2="38" y2="-88" stroke="url(#goldS2)" stroke-width="2"/>
  </g>
  <text x="250" y="330" font-family="'Cinzel', serif" font-size="18" font-weight="700" fill="url(#goldS2)" text-anchor="middle" letter-spacing="3">
    THE PROPOSAL • 2024
  </text>
</svg>
