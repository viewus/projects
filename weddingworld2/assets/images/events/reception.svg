<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="recBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="50%" stop-color="#050b14"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="goldR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6a24"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#recBg)"/>

  <!-- Ornate Border -->
  <rect x="20" y="20" width="560" height="360" rx="20" fill="none" stroke="url(#goldR)" stroke-width="2" opacity="0.6"/>

  <!-- Toasting Flutes & Sparkles -->
  <g transform="translate(300, 180)">
    <!-- Flute 1 (Left, Tilted) -->
    <g transform="rotate(-15) translate(-40, -40)">
      <polygon points="0,0 20,-70 -20,-70" fill="rgba(255, 245, 214, 0.4)" stroke="url(#goldR)" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="50" stroke="url(#goldR)" stroke-width="3"/>
      <ellipse cx="0" cy="50" rx="20" ry="6" fill="url(#goldR)"/>
    </g>

    <!-- Flute 2 (Right, Tilted) -->
    <g transform="rotate(15) translate(40, -40)">
      <polygon points="0,0 20,-70 -20,-70" fill="rgba(255, 245, 214, 0.4)" stroke="url(#goldR)" stroke-width="2"/>
      <line x1="0" y1="0" x2="0" y2="50" stroke="url(#goldR)" stroke-width="3"/>
      <ellipse cx="0" cy="50" rx="20" ry="6" fill="url(#goldR)"/>
    </g>

    <!-- Clinking Sparkle Burst -->
    <polygon points="0,-90 5,-75 20,-70 5,-65 0,-50 -5,-65 -20,-70 -5,-75" fill="#fff" stroke="url(#goldR)" stroke-width="1"/>
    <circle cx="0" cy="-70" r="25" fill="radial-gradient(circle, #fff, transparent)" opacity="0.4"/>
  </g>

  <!-- Twinkling Lights & Stars -->
  <circle cx="100" cy="100" r="3" fill="#ffd56b"/>
  <circle cx="500" cy="90" r="4" fill="#ffd56b"/>
  <circle cx="160" cy="220" r="2.5" fill="#fff"/>
  <circle cx="450" cy="240" r="3" fill="#fff"/>

  <!-- Title Banner -->
  <text x="300" y="340" font-family="'Cinzel', serif" font-size="22" font-weight="700" fill="url(#goldR)" text-anchor="middle" letter-spacing="4">
    GRAND ROYAL RECEPTION
  </text>
</svg>
