<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wedBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a0e17"/>
      <stop offset="50%" stop-color="#24050b"/>
      <stop offset="100%" stop-color="#0d0104"/>
    </linearGradient>
    <linearGradient id="goldW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8c6a24"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="50%" stop-color="#ff9900"/>
      <stop offset="85%" stop-color="#ffee55"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="kundBronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="60%" stop-color="#8c581e"/>
      <stop offset="100%" stop-color="#472605"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#wedBg)"/>

  <!-- Ornate Mandapam Pillars & Arch -->
  <g opacity="0.6">
    <rect x="60" y="40" width="25" height="300" fill="url(#goldW)"/>
    <rect x="515" y="40" width="25" height="300" fill="url(#goldW)"/>
    <path d="M 60 70 Q 300 10 540 70" fill="none" stroke="url(#goldW)" stroke-width="8"/>
    <!-- Hanging Floral Toran -->
    <path d="M 85 75 Q 160 110 235 75 Q 300 110 365 75 Q 440 110 515 75" fill="none" stroke="#ff4d6d" stroke-width="6"/>
  </g>

  <!-- Sacred Havan Kund (Agni) -->
  <g transform="translate(300, 230)">
    <!-- Base Step Kund -->
    <polygon points="-110,60 110,60 90,90 -90,90" fill="url(#kundBronze)" stroke="url(#goldW)" stroke-width="2"/>
    <polygon points="-90,30 90,30 75,60 -75,60" fill="url(#kundBronze)" stroke="url(#goldW)" stroke-width="2"/>
    <polygon points="-70,0 70,0 55,30 -55,30" fill="url(#kundBronze)" stroke="url(#goldW)" stroke-width="2"/>

    <!-- Sacred Agni / Vedic Flames -->
    <path d="M 0 5 Q -25 -40 0 -95 Q 25 -40 0 5 Z" fill="url(#fireGrad)"/>
    <path d="M -20 5 Q -45 -30 -25 -70 Q -5 -35 -20 5 Z" fill="url(#fireGrad)" opacity="0.9"/>
    <path d="M 20 5 Q 45 -30 25 -70 Q 5 -35 20 5 Z" fill="url(#fireGrad)" opacity="0.9"/>

    <!-- Sacred Smoke / Aura Glow -->
    <circle cx="0" cy="-45" r="75" fill="url(#fireGrad)" opacity="0.15"/>
  </g>

  <!-- Golden Varmala Rosary Arches -->
  <path d="M 180 180 Q 230 240 280 180" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-dasharray="5 5"/>
  <path d="M 320 180 Q 370 240 420 180" fill="none" stroke="#ff4d6d" stroke-width="6" stroke-dasharray="5 5"/>

  <!-- Title Banner -->
  <text x="300" y="360" font-family="'Cinzel', serif" font-size="22" font-weight="700" fill="url(#goldW)" text-anchor="middle" letter-spacing="4">
    THE SACRED MUHURTHAM
  </text>
</svg>
