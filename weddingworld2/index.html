<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Ananya & Rahul — Royal Wedding Invitation</title>
  
  <!-- Fallback Open Graph & Metadata -->
  <meta name="description" content="You are cordially invited to celebrate the royal wedding ceremonies of Ananya & Rahul.">
  <meta name="theme-color" content="#211d18">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./favicon/favicon.svg">

  <!-- Google Fonts: Cormorant Garamond (headings), Jost (body) — a restrained
       two-family type system for the minimal-luxury design. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Core Stylesheets -->
  <link rel="stylesheet" href="./assets/css/variables.css">
  <link rel="stylesheet" href="./assets/css/global.css">
  <link rel="stylesheet" href="./assets/css/animations.css">
  <link rel="stylesheet" href="./assets/css/wedding-card.css">
  <link rel="stylesheet" href="./assets/css/responsive.css">
</head>
<body class="lock-scroll">

  <!-- A single, very quiet paper grain overlay -->
  <div class="paper-texture-overlay" aria-hidden="true"></div>

  <!-- React mounts the entire wedding card experience into this node. -->
  <div id="root"></div>

  <!-- ==========================================================================
       CDN ENHANCEMENTS: GSAP + SCROLLTRIGGER (smooth entrance fade & scroll
       reveals only — no canvas-confetti / no dense particle engine).
       ========================================================================== -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <!-- ==========================================================================
       REACT + REACT-DOM (UMD builds, no bundler)
       ========================================================================== -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- ==========================================================================
       APPLICATION CODE
       weddingData (data.js) is plain JS. The React components (originally
       written as separate .jsx files under assets/js/) are precompiled ahead
       of time into a single plain-JS bundle.js — no in-browser Babel step.
       This avoids Babel Standalone's fetch()-based script loading, which is
       blocked by the browser when the page is opened directly as a local
       file (file://) instead of through a web server. Edit the .jsx sources
       and recompile with `node assets/js/build.js` (see assets/js/README.md).
       ========================================================================== -->
  <script src="./data.js"></script>
  <script src="./assets/js/bundle.js"></script>

</body>
</html>
