<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="haldiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#734b00"/>
      <stop offset="50%" stop-color="#472e00"/>
      <stop offset="100%" stop-color="#1f1400"/>
    </linearGradient>
    <radialGradient id="haldiGold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5a0"/>
      <stop offset="40%" stop-color="#ffcc00"/>
      <stop offset="80%" stop-color="#e69500"/>
      <stop offset="100%" stop-color="#b36200"/>
    </radialGradient>
    <linearGradient id="brassBowl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe680"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#8c6a24"/>
      <stop offset="100%" stop-color="#543b0c"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#haldiBg)"/>

  <!-- Golden Ray Backdrop -->
  <circle cx="300" cy="180" r="140" fill="url(#haldiGold)" opacity="0.25"/>

  <!-- Ornate Border -->
  <rect x="20" y="20" width="560" height="360" rx="20" fill="none" stroke="url(#brassBowl)" stroke-width="2" opacity="0.6"/>

  <!-- Traditional Brass Urli / Haldi Bowl -->
  <g transform="translate(300, 180)">
    <!-- Urli Outer Rim -->
    <ellipse cx="0" cy="40" rx="140" ry="45" fill="url(#brassBowl)" stroke="#fff5d6" stroke-width="2"/>
    <!-- Haldi Paste Surface -->
    <ellipse cx="0" cy="35" rx="125" ry="35" fill="url(#haldiGold)"/>
    <!-- Floating Rose & Marigold Petals -->
    <circle cx="-50" cy="30" r="12" fill="#ff4d6d"/>
    <circle cx="60" cy="35" r="14" fill="#ff4d6d"/>
    <circle cx="10" cy="45" r="16" fill="#ff9900"/>
    <circle cx="-20" cy="25" r="10" fill="#fff"/>
    <circle cx="35" cy="20" r="11" fill="#ff4d6d"/>

    <!-- Haldi Paste Swirls / Drops -->
    <path d="M 0 -60 Q 25 -20 0 15 Q -25 -20 0 -60 Z" fill="url(#haldiGold)"/>
    <circle cx="-60" cy="-30" r="8" fill="url(#haldiGold)"/>
    <circle cx="60" cy="-20" r="10" fill="url(#haldiGold)"/>
  </g>

  <!-- Marigold Garlands Hanging -->
  <g transform="translate(100, 30)">
    <circle cx="0" cy="15" r="12" fill="#ff9900"/>
    <circle cx="0" cy="40" r="12" fill="#ffcc00"/>
    <circle cx="0" cy="65" r="12" fill="#ff9900"/>
    <circle cx="0" cy="90" r="12" fill="#ffcc00"/>
  </g>
  <g transform="translate(500, 30)">
    <circle cx="0" cy="15" r="12" fill="#ff9900"/>
    <circle cx="0" cy="40" r="12" fill="#ffcc00"/>
    <circle cx="0" cy="65" r="12" fill="#ff9900"/>
    <circle cx="0" cy="90" r="12" fill="#ffcc00"/>
  </g>

  <!-- Typography Banner -->
  <text x="300" y="340" font-family="'Cinzel', serif" font-size="22" font-weight="700" fill="url(#brassBowl)" text-anchor="middle" letter-spacing="4">
    HALDI &amp; CHUDA CEREMONY
  </text>
</svg>
