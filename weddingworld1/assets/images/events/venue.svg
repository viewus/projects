<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="palaceSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120407"/>
      <stop offset="60%" stop-color="#3b0f17"/>
      <stop offset="100%" stop-color="#73202e"/>
    </linearGradient>
    <linearGradient id="palaceGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff5d6"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#8c6a24"/>
      <stop offset="100%" stop-color="#4d350c"/>
    </linearGradient>
    <linearGradient id="palaceStone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8dcbe"/>
      <stop offset="100%" stop-color="#948467"/>
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#palaceSky)"/>

  <!-- Stars in Night Sky -->
  <circle cx="120" cy="60" r="2" fill="#fff5d6" opacity="0.8"/>
  <circle cx="280" cy="40" r="1.5" fill="#fff5d6" opacity="0.6"/>
  <circle cx="500" cy="70" r="2" fill="#fff5d6" opacity="0.9"/>
  <circle cx="680" cy="50" r="1.5" fill="#fff5d6" opacity="0.7"/>

  <!-- Palace Silhouette & Architecture -->
  <g transform="translate(400, 280)">
    <!-- Main Center Dome & Turrets -->
    <path d="M -80 0 L -80 -120 Q 0 -180 80 -120 L 80 0 Z" fill="url(#palaceStone)"/>
    <path d="M -50 -120 Q 0 -220 50 -120 Z" fill="url(#palaceGold)"/>
    <line x1="0" y1="-220" x2="0" y2="-245" stroke="url(#palaceGold)" stroke-width="4"/>
    <circle cx="0" cy="-248" r="5" fill="url(#palaceGold)"/>

    <!-- Left Wing & Tower -->
    <rect x="-240" y="-70" width="160" height="70" fill="url(#palaceStone)"/>
    <path d="M -260 -70 L -260 -150 Q -220 -190 -180 -150 L -180 -70 Z" fill="url(#palaceStone)"/>
    <path d="M -245 -150 Q -220 -200 -195 -150 Z" fill="url(#palaceGold)"/>

    <!-- Right Wing & Tower -->
    <rect x="80" y="-70" width="160" height="70" fill="url(#palaceStone)"/>
    <path d="M 180 -70 L 180 -150 Q 220 -190 260 -150 L 260 -70 Z" fill="url(#palaceStone)"/>
    <path d="M 195 -150 Q 220 -200 245 -150 Z" fill="url(#palaceGold)"/>

    <!-- Arched Windows & Warm Lights -->
    <path d="M -20 -30 Q 0 -60 20 -30 L 20 0 L -20 0 Z" fill="url(#palaceGold)"/>
    <path d="M -60 -40 Q -50 -60 -40 -40 L -40 -15 L -60 -15 Z" fill="url(#palaceGold)"/>
    <path d="M 40 -40 Q 50 -60 60 -40 L 60 -15 L 40 -15 Z" fill="url(#palaceGold)"/>
    <path d="M -150 -40 Q -140 -60 -130 -40 L -130 -15 L -150 -15 Z" fill="url(#palaceGold)"/>
    <path d="M 130 -40 Q 140 -60 150 -40 L 150 -15 L 130 -15 Z" fill="url(#palaceGold)"/>
  </g>

  <!-- Palace Courtyard Lawns & Water Reflection -->
  <rect x="0" y="280" width="800" height="200" fill="#14080b"/>
  <ellipse cx="400" cy="380" rx="320" ry="60" fill="none" stroke="url(#palaceGold)" stroke-width="2" opacity="0.4"/>
  <ellipse cx="400" cy="380" rx="200" ry="35" fill="radial-gradient(ellipse, rgba(212,175,55,0.3), transparent)" opacity="0.6"/>

  <!-- Ornate Border Frame -->
  <rect x="15" y="15" width="770" height="450" rx="16" fill="none" stroke="url(#palaceGold)" stroke-width="2" opacity="0.7"/>

  <!-- Caption text -->
  <text x="400" y="440" font-family="'Cinzel', serif" font-size="20" font-weight="700" fill="url(#palaceGold)" text-anchor="middle" letter-spacing="3">
    THE GRAND HERITAGE PALACE &amp; RESORT
  </text>
</svg>
