<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="mehndiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e3a2f"/>
      <stop offset="60%" stop-color="#07241c"/>
      <stop offset="100%" stop-color="#03120e"/>
    </linearGradient>
    <linearGradient id="goldM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff5d6"/>
      <stop offset="100%" stop-color="#8c6a24"/>
    </linearGradient>
    <radialGradient id="marigold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="70%" stop-color="#ff7700"/>
      <stop offset="100%" stop-color="#cc4400"/>
    </radialGradient>
  </defs>

  <rect width="600" height="400" fill="url(#mehndiBg)"/>

  <!-- Ornate Floral Border -->
  <rect x="20" y="20" width="560" height="360" rx="20" fill="none" stroke="url(#goldM)" stroke-width="2" opacity="0.6"/>
  <rect x="30" y="30" width="540" height="340" rx="14" fill="none" stroke="url(#goldM)" stroke-width="1" stroke-dasharray="4 6" opacity="0.4"/>

  <!-- Mehndi Henna Palm Artwork -->
  <g transform="translate(300, 190)">
    <!-- Central Mandala on Palm -->
    <circle r="60" fill="none" stroke="url(#goldM)" stroke-width="3"/>
    <circle r="45" fill="none" stroke="url(#goldM)" stroke-dasharray="5 5" stroke-width="2"/>
    <circle r="25" fill="#07241c" stroke="url(#goldM)" stroke-width="2"/>
    <circle r="10" fill="url(#goldM)"/>

    <!-- Intricate Henna Petals around Mandala -->
    <path d="M 0 -60 Q 15 -85 0 -105 Q -15 -85 0 -60 Z" fill="url(#goldM)"/>
    <path d="M 0 60 Q 15 85 0 105 Q -15 85 0 60 Z" fill="url(#goldM)"/>
    <path d="M -60 0 Q -85 15 -105 0 Q -85 -15 -60 0 Z" fill="url(#goldM)"/>
    <path d="M 60 0 Q 85 15 105 0 Q 85 -15 60 0 Z" fill="url(#goldM)"/>

    <path d="M -42 -42 Q -65 -75 -75 -65 Q -75 -40 -42 -42 Z" fill="url(#goldM)"/>
    <path d="M 42 42 Q 65 75 75 65 Q 75 40 42 42 Z" fill="url(#goldM)"/>
    <path d="M -42 42 Q -75 65 -65 75 Q -40 75 -42 42 Z" fill="url(#goldM)"/>
    <path d="M 42 -42 Q 75 -65 65 -75 Q 40 -75 42 -42 Z" fill="url(#goldM)"/>
  </g>

  <!-- Hanging Marigold Garlands -->
  <g transform="translate(60, 40)">
    <circle cx="0" cy="20" r="14" fill="url(#marigold)"/>
    <circle cx="0" cy="50" r="14" fill="url(#marigold)"/>
    <circle cx="0" cy="80" r="14" fill="url(#marigold)"/>
    <circle cx="0" cy="110" r="14" fill="url(#marigold)"/>
    <circle cx="0" cy="140" r="14" fill="url(#marigold)"/>
  </g>
  <g transform="translate(540, 40)">
    <circle cx="0" cy="20" r="14" fill="url(#marigold)"/>
    <circle cx="0" cy="50" r="14" fill="url(#marigold)"/>
    <circle cx="0" cy="80" r="14" fill="url(#marigold)"/>
    <circle cx="0" cy="110" r="14" fill="url(#marigold)"/>
    <circle cx="0" cy="140" r="14" fill="url(#marigold)"/>
  </g>

  <!-- Typography Banner -->
  <text x="300" y="340" font-family="'Cinzel', serif" font-size="22" font-weight="700" fill="url(#goldM)" text-anchor="middle" letter-spacing="4">
    MEHNDI CELEBRATION
  </text>
</svg>
