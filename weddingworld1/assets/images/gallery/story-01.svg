<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="storyBg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#401822"/>
      <stop offset="100%" stop-color="#14060a"/>
    </linearGradient>
    <linearGradient id="goldS1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7a5814"/>
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#storyBg1)"/>
  <rect x="20" y="20" width="460" height="360" rx="12" fill="none" stroke="url(#goldS1)" stroke-width="1.5" opacity="0.6"/>
  <!-- Story Motif: First Meeting / Coffee / Books -->
  <g transform="translate(250, 190)">
    <circle r="70" fill="none" stroke="url(#goldS1)" stroke-width="2" opacity="0.8"/>
    <!-- Traditional Cup & Saucer Motif -->
    <ellipse cx="0" cy="35" rx="55" ry="14" fill="url(#goldS1)"/>
    <path d="M -35 30 C -30 -15 30 -15 35 30 Z" fill="#fff5d6" stroke="url(#goldS1)" stroke-width="2"/>
    <path d="M 32 0 C 48 0 48 20 32 20" fill="none" stroke="url(#goldS1)" stroke-width="3"/>
    <!-- Gentle Steam -->
    <path d="M -10 -25 Q -18 -45 -10 -60" fill="none" stroke="url(#goldS1)" stroke-width="2" stroke-linecap="round"/>
    <path d="M 10 -25 Q 18 -45 10 -60" fill="none" stroke="url(#goldS1)" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="250" y="330" font-family="'Cinzel', serif" font-size="18" font-weight="700" fill="url(#goldS1)" text-anchor="middle" letter-spacing="3">
    THE FIRST CHAPTER • 2022
  </text>
</svg>
