<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="storyBg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b3624"/>
      <stop offset="100%" stop-color="#06120b"/>
    </linearGradient>
    <linearGradient id="goldS3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff0b8"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#7a5814"/>
    </linearGradient>
  </defs>
  <rect width="500" height="400" fill="url(#storyBg3)"/>
  <rect x="20" y="20" width="460" height="360" rx="12" fill="none" stroke="url(#goldS3)" stroke-width="1.5" opacity="0.6"/>
  <!-- Story Motif: Traditional Roka Kalash & Coconut / Swastik -->
  <g transform="translate(250, 190)">
    <!-- Sacred Kalash Pot -->
    <ellipse cx="0" cy="50" rx="35" ry="12" fill="url(#goldS3)"/>
    <path d="M -45 40 C -55 -10 55 -10 45 40 Z" fill="url(#goldS3)"/>
    <!-- Mango Leaves & Coconut -->
    <path d="M -30 0 Q -50 -35 -15 -25 Z" fill="#2d6a4f"/>
    <path d="M 30 0 Q 50 -35 15 -25 Z" fill="#2d6a4f"/>
    <path d="M 0 -10 Q 0 -50 0 -20 Z" fill="#2d6a4f"/>
    <circle cx="0" cy="-25" r="24" fill="#6f4e37" stroke="url(#goldS3)" stroke-width="2"/>
  </g>
  <text x="250" y="330" font-family="'Cinzel', serif" font-size="18" font-weight="700" fill="url(#goldS3)" text-anchor="middle" letter-spacing="3">
    THE SACRED BLESSING • 2026
  </text>
</svg>
