<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-seo="title">Spice Route Kitchen | Multi-Cuisine Restaurant &amp; Food Delivery</title>
<meta name="description" data-seo="description" content="Order fresh Chinese, Indian, Italian, pizza, burgers and more.">
<meta name="keywords" data-seo="keywords" content="">
<meta name="theme-color" content="#C62828">
<link rel="canonical" href="https://REPLACE-WITH-YOUR-DOMAIN.com/">
<meta property="og:type" content="website">
<meta property="og:title" data-seo="ogTitle" content="Spice Route Kitchen">
<meta property="og:description" data-seo="ogDescription" content="">
<meta property="og:image" data-seo="ogImage" content="">
<meta property="og:url" content="https://REPLACE-WITH-YOUR-DOMAIN.com/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" data-seo="ogTitle" content="">
<meta name="twitter:description" data-seo="ogDescription" content="">
<link rel="icon" href="assets/svg/logos/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="assets/css/main.min.css">
<script type="application/ld+json" id="structuredData"></script>
</head>
<body>
<div id="announcementBar" class="announcementBar" role="status" aria-live="polite" hidden>
  <div class="announcementTrack" id="announcementTrack"></div>
</div>
<header id="siteHeader" class="siteHeader">
  <div class="container headerInner">
    <a href="#home" class="brand" id="brandLink" aria-label="Go to homepage">
      <img id="brandLogo" src="assets/svg/logos/logo.svg" alt="" class="brandLogo">
      <span id="brandName" class="brandName"></span>
    </a>
    <nav class="mainNav" id="mainNav" aria-label="Primary">
      <ul id="navList" class="navList"></ul>
    </nav>
    <div class="headerActions">
      <button type="button" class="iconBtn searchToggle" id="searchToggle" aria-label="Search menu" aria-expanded="false">
        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      </button>
      <a href="#" class="btn btnPrimary orderNowBtn" id="headerOrderBtn">Order Now</a>
      <button type="button" class="hamburger" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
  <div class="searchPanel" id="searchPanel" hidden>
    <div class="container searchPanelInner">
      <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
      <input type="search" id="menuSearchInput" class="searchInput" placeholder="Search the menu..." aria-label="Search the menu">
      <button type="button" class="iconBtn" id="searchClose" aria-label="Close search"><i class="fa-solid fa-xmark"></i></button>
    </div>
  </div>
</header>
<div class="mobileMenu" id="mobileMenu" hidden>
  <nav aria-label="Mobile Primary">
    <ul id="mobileNavList" class="mobileNavList"></ul>
  </nav>
  <a href="#" class="btn btnPrimary mobileOrderBtn" id="mobileOrderBtn">Order Now</a>
</div>
<div class="mobileMenuOverlay" id="mobileMenuOverlay" hidden></div>
<main id="mainContent">
  <section id="home" class="hero" aria-label="Hero">
    <div class="container heroGrid">
      <div class="heroContent">
        <p class="heroEyebrow" id="heroEyebrow"></p>
        <h1 class="heroTitle">
          <span id="heroTitleMain"></span>
          <span id="heroTitleHighlight" class="heroTitleHighlight"></span>
        </h1>
        <p class="heroSubtitle" id="heroSubtitle"></p>
        <div class="heroCtas" id="heroCtas"></div>
        <div class="heroMeta">
          <div class="heroRating" id="heroRating"></div>
          <div class="heroBadges" id="heroBadges"></div>
        </div>
        <p class="heroDelivery" id="heroDeliveryInfo"></p>
      </div>
      <div class="heroVisual" id="heroVisual" aria-hidden="false"></div>
    </div>
  </section>
  <div class="menuBrowseWrap">
    <section id="categoryNavSection" class="categoryNavSection" aria-label="Menu categories">
      <div class="container">
        <div class="categoryScroller" id="categoryScroller" role="tablist" aria-label="Filter menu by category"></div>
      </div>
    </section>
    <section id="menu" class="menuSection" aria-label="Menu">
      <div class="container">
        <div class="sectionHeading" data-heading="menu">
          <p class="sectionEyebrow"></p>
          <h2 class="sectionTitle"></h2>
          <p class="sectionSubtitle"></p>
        </div>
        <div class="menuToolbar">
          <div class="menuSearchWrap">
            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
            <input type="search" id="inlineMenuSearch" class="menuSearchInput" placeholder="Search for pizza, noodles, chicken...">
          </div>
          <div class="menuFilters" id="menuFilters" role="group" aria-label="Dietary filters"></div>
        </div>
        <p class="menuResultsCount" id="menuResultsCount" aria-live="polite"></p>
        <div class="menuGrid" id="menuGrid"></div>
        <p class="menuEmptyState" id="menuEmptyState" hidden>No dishes match your search. Try a different keyword or category.</p>
      </div>
    </section>
  </div>
  <section id="featured" class="featuredSection" aria-label="Customer favourites">
    <div class="container">
      <div class="sectionHeading" data-heading="featured">
        <p class="sectionEyebrow"></p>
        <h2 class="sectionTitle"></h2>
      </div>
      <div class="featuredScroller" id="featuredScroller"></div>
    </div>
  </section>
  <section id="offers" class="offersSection" aria-label="Special offers">
    <div class="container">
      <div class="sectionHeading" data-heading="offers">
        <p class="sectionEyebrow"></p>
        <h2 class="sectionTitle"></h2>
      </div>
      <div class="offersGrid" id="offersGrid"></div>
    </div>
  </section>
  <section id="features" class="featuresSection" aria-label="Why choose us">
    <div class="container">
      <div class="sectionHeading" data-heading="features">
        <p class="sectionEyebrow"></p>
        <h2 class="sectionTitle"></h2>
      </div>
      <div class="featureGrid" id="featureGrid"></div>
    </div>
  </section>
  <section id="about" class="aboutSection" aria-label="About us">
    <div class="container aboutGrid">
      <div class="aboutImageWrap">
        <img id="aboutImage" src="" alt="" loading="lazy">
      </div>
      <div class="aboutContent">
        <p class="sectionEyebrow" id="aboutSubtitle"></p>
        <h2 class="sectionTitle" id="aboutTitle"></h2>
        <p class="aboutDescription" id="aboutDescription"></p>
        <div class="aboutStats" id="aboutStats"></div>
        <a href="#menu" class="btn btnOutline" id="aboutCta"></a>
      </div>
    </div>
  </section>
  <section id="process" class="processSection" aria-label="How we prepare your food">
    <div class="container">
      <div class="sectionHeading">
        <p class="sectionEyebrow" id="processEyebrow">Behind The Scenes</p>
        <h2 class="sectionTitle" id="processTitle"></h2>
        <p class="sectionSubtitle" id="processSubtitle"></p>
      </div>
      <div class="processTimeline" id="processTimeline"></div>
    </div>
  </section>
  <section id="gallery" class="gallerySection" aria-label="Photo gallery">
    <div class="container">
      <div class="sectionHeading" data-heading="gallery">
        <p class="sectionEyebrow"></p>
        <h2 class="sectionTitle"></h2>
      </div>
      <div class="galleryGrid" id="galleryGrid"></div>
    </div>
  </section>
  <section id="testimonials" class="testimonialsSection" aria-label="Customer reviews">
    <div class="container">
      <div class="sectionHeading" data-heading="testimonials">
        <p class="sectionEyebrow"></p>
        <h2 class="sectionTitle"></h2>
      </div>
      <div class="testimonialsGrid" id="testimonialsGrid"></div>
    </div>
  </section>
  <section id="faq" class="faqSection" aria-label="Frequently asked questions">
    <div class="container">
      <div class="sectionHeading" data-heading="faq">
        <p class="sectionEyebrow"></p>
        <h2 class="sectionTitle"></h2>
      </div>
      <div class="faqAccordion" id="faqAccordion"></div>
    </div>
  </section>
  <section id="contact" class="contactSection" aria-label="Contact and order">
    <div class="container contactGrid">
      <div class="contactCta">
        <h2 class="contactTitle" id="contactTitle"></h2>
        <p class="contactSubtitle" id="contactSubtitle"></p>
        <div class="contactCtaButtons" id="contactCtaButtons"></div>
      </div>
      <div class="contactDetails" id="contactDetails"></div>
    </div>
  </section>
</main>
<a href="#" class="floatingOrderBtn" id="floatingOrderBtn" hidden>
  <i class="fa-solid fa-bag-shopping" aria-hidden="true"></i>
  <span id="floatingOrderLabel"></span>
</a>
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image viewer">
  <button type="button" class="lightboxClose" id="lightboxClose" aria-label="Close image viewer"><i class="fa-solid fa-xmark"></i></button>
  <button type="button" class="lightboxNav lightboxPrev" id="lightboxPrev" aria-label="Previous image"><i class="fa-solid fa-chevron-left"></i></button>
  <figure class="lightboxFigure">
    <img id="lightboxImage" src="" alt="">
    <figcaption id="lightboxCaption"></figcaption>
  </figure>
  <button type="button" class="lightboxNav lightboxNext" id="lightboxNext" aria-label="Next image"><i class="fa-solid fa-chevron-right"></i></button>
</div>
<footer class="siteFooter" id="siteFooter">
  <div class="container footerGrid">
    <div class="footerBrand">
      <img id="footerLogo" src="assets/svg/logos/logo.svg" alt="" class="footerLogoImg">
      <span id="footerBrandName" class="footerBrandName"></span>
      <p id="footerDescription" class="footerDescription"></p>
      <div class="footerSocial" id="footerSocial"></div>
    </div>
    <div class="footerCol">
      <h3>Navigate</h3>
      <ul id="footerNavList" class="footerNavList"></ul>
    </div>
    <div class="footerCol">
      <h3>Contact</h3>
      <ul id="footerContactList" class="footerContactList"></ul>
    </div>
    <div class="footerCol">
      <h3>Opening Hours</h3>
      <ul id="footerHoursList" class="footerHoursList"></ul>
      <a href="#" class="btn btnPrimary footerOrderBtn" id="footerOrderBtn"></a>
    </div>
  </div>
  <div class="footerBottom">
    <div class="container">
      <p id="footerCopyright"></p>
    </div>
  </div>
</footer>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script src="data/restaurantData.min.js"></script>
<script src="assets/js/utils/helpers.min.js"></script>
<script src="assets/js/components/renderers/menuRenderer.min.js"></script>
<script src="assets/js/components/renderers/offerRenderer.min.js"></script>
<script src="assets/js/components/renderers/featureRenderer.min.js"></script>
<script src="assets/js/components/renderers/galleryRenderer.min.js"></script>
<script src="assets/js/components/renderers/testimonialRenderer.min.js"></script>
<script src="assets/js/components/renderers/faqRenderer.min.js"></script>
<script src="assets/js/components/animations.min.js"></script>
<script src="assets/js/main.min.js"></script>
</body>
</html>
