<!-- Structure only. Every list in here — explore links, help links, contact
     lines and social icons — is built from data/footer.json + config/config.json.
     To add, remove or reorder a contact line, edit "reachItems" in
     data/footer.json. Nothing in this file needs to change. -->
<footer class="siteFooter">
  <!-- Decorative layers: coarse grain, torn fibres along the top edge, a tree
       sunk into the corner and grass rooted along the base. All aria-hidden. -->
  <span class="footerRough" aria-hidden="true"></span>
  <span class="footerFibres" aria-hidden="true"></span>
  <img class="footerTree" id="footerTree" src="" alt="" aria-hidden="true">
  <span class="footerGrass" aria-hidden="true"></span>
  <div class="container">
    <div class="row footerGrid">

      <div class="col-lg-4 col-md-6 footerCol footerColBrand">
        <a class="footerBrand" id="footerBrandLink" href="#">
          <img class="footerLogo" id="footerLogo" src="" alt="Punarjiva Organics leaf emblem">
          <span data-footer="aboutHeading"></span>
        </a>
        <p class="footerAbout" data-footer="aboutText"></p>
        <div class="footerSocial" id="footerSocial"></div>
      </div>

      <div class="col-lg-2 col-md-6 col-6 footerCol">
        <h3 class="footerHeading" data-footer="exploreHeading"></h3>
        <ul class="footerLinks" id="footerExploreLinks"></ul>
      </div>

      <div class="col-lg-2 col-md-6 col-6 footerCol">
        <h3 class="footerHeading" data-footer="helpHeading"></h3>
        <ul class="footerLinks" id="footerHelpLinks"></ul>
      </div>

      <div class="col-lg-4 col-md-6 footerCol">
        <h3 class="footerHeading" data-footer="reachHeading"></h3>
        <address class="footerAddress" id="footerReachList"></address>
      </div>

    </div>

    <div class="footerBottom">
      <p class="footerCopy" data-footer="copyright"></p>
    </div>
  </div>
</footer>
