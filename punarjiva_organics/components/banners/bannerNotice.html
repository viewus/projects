<!-- Amber warning strip. Used for the sample-review guard and any other
     "this content is not final" notice. Role=status so screen readers announce it. -->
<div class="bannerNotice" role="status">
  <i class="bi bi-exclamation-triangle-fill bannerNoticeIcon" aria-hidden="true"></i>
  <div class="bannerNoticeText">
    <strong class="bannerNoticeTitle">{{title}}</strong>
    <span class="bannerNoticeBody">{{body}}</span>
  </div>
</div>
