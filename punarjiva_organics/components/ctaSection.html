<!-- Reusable closing CTA. Heading and text come from the page's own data/*.json
     via ctaHeading / ctaText; the three action buttons come from config/config.json. -->
<section class="ctaSection">
  <div class="container ctaSectionInner">
    <h2 class="ctaSectionTitle" data-content="ctaHeading"></h2>
    <p class="ctaSectionText" data-content="ctaText"></p>
    <div class="ctaSectionActions" id="ctaSectionActions"></div>
  </div>
</section>
