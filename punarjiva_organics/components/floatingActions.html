<!-- Always-reachable actions. Links are filled from config/config.json by
     initFloatingActions(), so the phone number still lives in exactly one place. -->
<div class="floatingActions">
  <a class="floatingBtn floatingWhatsapp" id="floatingWhatsapp" href="#"
     target="_blank" rel="noopener" aria-label="Order on WhatsApp">
    <i class="bi bi-whatsapp" aria-hidden="true"></i>
  </a>
  <a class="floatingBtn floatingCall" id="floatingCall" href="#" aria-label="Call the store">
    <i class="bi bi-telephone-fill" aria-hidden="true"></i>
  </a>
  <button class="floatingBtn floatingTop" id="floatingTop" type="button" aria-label="Back to top">
    <i class="bi bi-arrow-up" aria-hidden="true"></i>
  </button>
</div>
