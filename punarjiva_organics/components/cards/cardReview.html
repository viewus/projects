<article class="card cardReview {{placeholderClass}}">
  <div class="cardReviewStars" role="img" aria-label="{{rating}} out of 5 stars">{{starsHtml}}</div>
  <blockquote class="cardReviewText">{{text}}</blockquote>
  <footer class="cardReviewFooter">
    <span class="cardReviewName">{{name}}</span>
    <span class="cardReviewLocation">{{location}}</span>
  </footer>
  {{placeholderTagHtml}}
</article>
