<article class="card cardElevated">
  <div class="cardMedia">
    <img class="cardImage" src="{{image}}" alt="{{imageAlt}}" loading="lazy">
  </div>
  <div class="cardBodyWrap">
    <i class="cardIcon bi {{icon}}" aria-hidden="true"></i>
    <h3 class="cardTitle">{{title}}</h3>
    <p class="cardBody">{{body}}</p>
    <ul class="cardList">{{itemsHtml}}</ul>
  </div>
</article>
