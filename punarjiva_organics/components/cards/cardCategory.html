<!-- Range card. A whole card that is a link, not a card with a link inside it —
     the target is the filtered catalogue (pages/products.html?type=...), so the
     entire tile should be clickable rather than just four words at the bottom. -->
<a class="card cardCategory" href="{{href}}">
  <span class="cardCategoryGlyph" aria-hidden="true"><i class="bi {{icon}}"></i></span>
  <h3 class="cardTitle">{{title}}</h3>
  <p class="cardBody">{{body}}</p>
  <span class="cardCategoryCount">{{countLabel}}</span>
  <span class="cardCategoryMore">{{moreLabel}} <i class="bi bi-arrow-right" aria-hidden="true"></i></span>
</a>
