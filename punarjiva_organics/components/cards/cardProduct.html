<!-- Catalogue card. Rendered by productRenderer.js from an entry in
     data/products.json. --cardIndex drives the staggered grid entrance in
     product.css, so the whole grid unfolds in reading order after a filter
     change rather than snapping into place. -->
<a class="productCard" href="{{href}}" style="--cardIndex: {{index}}">
  {{rankHtml}}
  <div class="productCardMedia">
    <img class="productCardImage" src="{{image}}" alt="{{imageAlt}}" loading="lazy">
    {{altImageHtml}}
    <div class="productCardBadges">{{badgesHtml}}</div>
  </div>

  <div class="productCardBody">
    <p class="productCardType">{{typeLabel}}</p>
    <h3 class="productCardTitle">{{name}}</h3>
    <p class="productCardTagline">{{tagline}}</p>
    <div class="productCardTags">{{tagsHtml}}</div>
    <span class="productCardMore">{{moreLabel}} <i class="bi bi-arrow-right" aria-hidden="true"></i></span>
  </div>
</a>
