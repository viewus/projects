<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="220" height="220" role="presentation" aria-hidden="true">
  <!-- The lotus/mandala petal ring that surrounds the tree in the Punarjiva
       logo. Used as a corner ornament and section divider. -->
  <g transform="translate(110,110)">
    <g id="petalRing" fill="#7A2554" stroke="#D4A63F" stroke-width="2">
      <path d="M0-96c11 0 20 9 20 20 0 13-9 24-20 34-11-10-20-21-20-34 0-11 9-20 20-20z" opacity=".85"/>
    </g>
    <use href="#petalRing" transform="rotate(30)"/>
    <use href="#petalRing" transform="rotate(60)"/>
    <use href="#petalRing" transform="rotate(90)"/>
    <use href="#petalRing" transform="rotate(120)"/>
    <use href="#petalRing" transform="rotate(150)"/>
    <use href="#petalRing" transform="rotate(180)"/>
    <use href="#petalRing" transform="rotate(210)"/>
    <use href="#petalRing" transform="rotate(240)"/>
    <use href="#petalRing" transform="rotate(270)"/>
    <use href="#petalRing" transform="rotate(300)"/>
    <use href="#petalRing" transform="rotate(330)"/>
    <circle r="58" fill="none" stroke="#D4A63F" stroke-width="2.5"/>
    <circle r="52" fill="none" stroke="#7A2554" stroke-width="1.2" opacity=".6"/>
  </g>
</svg>
