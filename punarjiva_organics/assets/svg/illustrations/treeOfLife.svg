<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="presentation" aria-hidden="true">
  <!-- Tree of life, echoing the mark at the centre of the Punarjiva logo.
       Used as a low-opacity watermark behind sections. -->
  <g fill="none" stroke="#1F5C35" stroke-linecap="round">
    <!-- trunk + roots -->
    <path d="M120 210V128" stroke-width="7"/>
    <path d="M120 210c-16 0-28-4-38-11M120 210c16 0 28-4 38-11M120 200c-10 4-22 6-34 6M120 200c10 4 22 6 34 6" stroke-width="3.2" opacity=".8"/>
    <!-- main limbs -->
    <path d="M120 150c-20-8-32-22-38-40M120 150c20-8 32-22 38-40" stroke-width="4.4"/>
    <path d="M120 128c-26-6-44-20-54-40M120 128c26-6 44-20 54-40" stroke-width="3.8"/>
    <path d="M120 112c-14-14-20-30-20-48M120 112c14-14 20-30 20-48" stroke-width="3.4"/>
    <!-- fine branching -->
    <path d="M92 96c-10-4-18-12-22-22M148 96c10-4 18-12 22-22M104 74c-6-8-9-17-9-27M136 74c6-8 9-17 9-27" stroke-width="2.4" opacity=".85"/>
  </g>
  <!-- canopy -->
  <g fill="#2F7A45">
    <circle cx="120" cy="72" r="46" opacity=".22"/>
    <circle cx="84" cy="90" r="30" opacity=".2"/>
    <circle cx="156" cy="90" r="30" opacity=".2"/>
    <circle cx="120" cy="48" r="26" opacity=".18"/>
    <circle cx="94" cy="58" r="20" opacity=".16"/>
    <circle cx="146" cy="58" r="20" opacity=".16"/>
  </g>
  <g fill="#1F5C35" opacity=".5">
    <circle cx="98" cy="66" r="3.6"/><circle cx="140" cy="62" r="3.2"/>
    <circle cx="120" cy="42" r="3"/><circle cx="78" cy="92" r="3.2"/>
    <circle cx="162" cy="94" r="3"/><circle cx="120" cy="96" r="3.4"/>
  </g>
</svg>
