<body data-page="contact">

  <a class="skipLink" href="#mainContent">Skip to main content</a>

  <div id="headerPlaceholder"></div>
  <div id="navPlaceholder"></div>

  <main id="mainContent">

    <div id="pageHeaderPlaceholder"></div>


    <section class="pageSection">
      <div class="container">

        <div class="sectionHeader">
          <h2 data-content="quickHeading"></h2>
          <p class="sectionIntro" data-content="quickText"></p>
          <!-- Call / WhatsApp / Directions stay prominent: they are how the
               store actually takes orders. The form is an addition. -->
          <div class="contactQuickActions" id="contactQuickActions"></div>
        </div>

        <div class="contactGrid" style="margin-top: 3rem;">

          <div class="contactFormWrap">
            <h2 data-content="formHeading"></h2>
            <p class="sectionIntro" data-content="formIntro"></p>

            <form id="contactForm" novalidate>
              <div class="formGroup">
                <label class="formLabel" for="contactName">
                  <span data-content="fields.nameLabel">Your name</span><span class="formRequired">*</span>
                </label>
                <input class="formInput" type="text" id="contactName" name="name" autocomplete="name"
                       data-placeholder="fields.namePlaceholder" required>
                <p class="formError"></p>
              </div>

              <div class="formGroup">
                <label class="formLabel" for="contactPhone">
                  <span data-content="fields.phoneLabel"></span><span class="formRequired">*</span>
                </label>
                <input class="formInput" type="tel" id="contactPhone" name="phone" autocomplete="tel"
                       data-placeholder="fields.phonePlaceholder" required>
                <p class="formError"></p>
              </div>

              <div class="formGroup">
                <label class="formLabel" for="contactEmail" data-content="fields.emailLabel"></label>
                <input class="formInput" type="email" id="contactEmail" name="email" autocomplete="email"
                       data-placeholder="fields.emailPlaceholder">
                <p class="formHint" data-content="fields.emailHint"></p>
                <p class="formError"></p>
              </div>

              <div class="formGroup">
                <label class="formLabel" for="contactInterest" data-content="fields.interestLabel"></label>
                <select class="formSelect" id="contactInterest" name="interest"></select>
                <p class="formError"></p>
              </div>

              <div class="formGroup">
                <label class="formLabel" for="contactMessage">
                  <span data-content="fields.messageLabel"></span><span class="formRequired">*</span>
                </label>
                <textarea class="formTextarea" id="contactMessage" name="message"
                          data-placeholder="fields.messagePlaceholder" required></textarea>
                <p class="formError"></p>
              </div>

              <div class="formSubmitRow">
                <button class="formSubmit" type="submit" id="contactSubmit" data-content="fields.submitLabel"></button>
              </div>

              <div class="formStatus" id="contactFormStatus" role="status" aria-live="polite"></div>
            </form>

            <p class="formEndpointNotice" data-content="endpointNotice"></p>
          </div>

          <aside class="contactAside">
            <h2 class="contactAsideHeading" data-content="addressHeading"></h2>
            <p class="contactAsideValue" id="contactAddress"></p>

            <h2 class="contactAsideHeading" data-content="hoursHeading"></h2>
            <p class="contactAsideValue" id="contactHours"></p>
          </aside>

        </div>
      </div>
    </section>

  </main>

  <div id="floatingActionsPlaceholder"></div>
  <div id="footerPlaceholder"></div>
