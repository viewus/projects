<a class="categoryCard staggerItem" href="{{href}}" style="--cardIndex: {{index}}">
  <img class="categoryCardImage" {{imgAttrsHtml}} alt="{{imageAlt}}" loading="lazy" width="600" height="600">
  <span class="categoryCardOverlay">
    <span class="categoryCardTitle">{{name}}</span>
    <span class="categoryCardCount">{{countLabel}}</span>
  </span>
</a>
