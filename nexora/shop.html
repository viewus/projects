<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Electronics Catalogue | NEXORA ELECTRONICS Showroom</title>
  <meta name="description" content="Browse all smartphones, laptops, 4K TVs, studio headphones and accessories at Nexora Electronics Bengaluru. Multi-facet filters, live prices and instant WhatsApp checkout." />
  <!-- FontAwesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/nexora.css" />
</head>
<body>

  <!-- Component Mount Points -->
  <div id="nexora-topbar-mount"></div>
  <div id="nexora-header-mount"></div>
  <div id="nexora-category-nav-mount"></div>
  <div id="nexora-sub-nav-mount"></div>

  <!-- Breadcrumbs -->
  <div class="container" style="margin-top: 14px;">
    <div class="store-breadcrumbs">
      <a href="index.html">Home</a>
      <span>›</span>
      <span style="font-weight: 600; color: var(--text-heading);">Showroom Catalogue</span>
    </div>
  </div>

  <!-- Shop Main Content -->
  <main class="container" style="margin-top: 16px; margin-bottom: 48px;">
    <!-- Dynamic Category Spotlight Banner -->
    <div id="nexora-shop-hero-mount"></div>

    <div class="shop-page-layout">
      
      <!-- Filter Sidebar -->
      <aside class="shop-filter-sidebar">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border-subtle);">
          <h3 style="font-size: 1.05rem; font-weight: 800; color: var(--text-heading); font-family: var(--font-heading);"><i class="fa-solid fa-sliders" style="color:var(--accent-cyan); margin-right:6px;"></i> Facet Filters</h3>
          <button type="button" class="btn-text" onclick="window.NexoraApp.resetAllFilters()" style="color: var(--accent-cyan); font-size: 0.8rem; font-weight: 700; background: none; border: none; cursor: pointer;">
            <i class="fa-solid fa-arrows-rotate" style="margin-right:4px;"></i> Reset All
          </button>
        </div>

        <!-- Price Range Slider -->
        <div class="filter-group">
          <label class="filter-group-title"><i class="fa-solid fa-indian-rupee-sign" style="margin-right:4px;"></i> MAX PRICE: <span id="price-slider-value" style="color:var(--accent-cyan); font-family:var(--font-mono);">₹3,00,000</span></label>
          <input 
            type="range" 
            min="5000" 
            max="300000" 
            step="5000" 
            value="300000" 
            class="filter-range-slider" 
            id="price-range-slider" 
            oninput="window.NexoraApp.onPriceFilterChange(this.value)" 
          />
        </div>

        <!-- Categories Filter -->
        <div class="filter-group">
          <label class="filter-group-title"><i class="fa-solid fa-layer-group" style="margin-right:4px;"></i> DEPARTMENTS</label>
          <div class="filter-options-list" id="filter-categories-list">
            <!-- Rendered by JS -->
          </div>
        </div>

        <!-- Brands Filter -->
        <div class="filter-group">
          <label class="filter-group-title"><i class="fa-solid fa-certificate" style="margin-right:4px;"></i> TOP BRANDS</label>
          <div class="filter-options-list" id="filter-brands-list">
            <!-- Rendered by JS -->
          </div>
        </div>

        <!-- In Stock Toggle -->
        <div class="filter-group">
          <label class="filter-check-item">
            <input type="checkbox" id="filter-instock-toggle" onchange="window.NexoraApp.state.activeFilters.inStockOnly = this.checked; window.NexoraApp.applyShopFilters();" />
            <span><i class="fa-solid fa-box-check" style="color:#10b981; margin-right:4px;"></i> In-Stock Showroom Only</span>
          </label>
        </div>
      </aside>

      <!-- Products Grid Section -->
      <section class="shop-products-section">
        <!-- Results Bar -->
        <div class="shop-results-bar">
          <div id="shop-results-count" style="font-weight: 700; color: var(--text-heading); font-size: 0.9rem;">
            Loading catalogue...
          </div>

          <div style="display: flex; align-items: center; gap: 12px;">
            <label for="shop-sort-select" style="font-size: 0.82rem; color: var(--text-muted); font-weight: 600;"><i class="fa-solid fa-arrow-down-short-wide" style="margin-right:4px;"></i> Sort By:</label>
            <select class="form-select" id="shop-sort-select" onchange="window.NexoraApp.onSortChange(this.value)" style="width: auto; padding: 6px 12px; font-size: 0.85rem;">
              <option value="featured">Featured Showroom Tech</option>
              <option value="price-asc">Price: Low to High</option>
              <option value="price-desc">Price: High to Low</option>
              <option value="rating">Highest Customer Rating</option>
              <option value="discount">Biggest Discount</option>
            </select>
          </div>
        </div>

        <!-- Products Grid -->
        <div class="products-grid-layout" id="shop-products-grid">
          <!-- Rendered dynamically by NexoraApp.applyShopFilters() -->
        </div>
      </section>

    </div>
  </main>

  <!-- Component Mount Point: Footer -->
  <div id="nexora-footer-mount"></div>

  <!-- Core Scripts -->
  <script src="js/products-data.js"></script>
  <script src="js/nexora-components.js"></script>
  <script src="js/nexora.js"></script>
</body>
</html>
