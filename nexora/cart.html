<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shopping Cart & Order Quotation | NEXORA ELECTRONICS</title>
  <meta name="description" content="View items in your cart, calculate showroom discounts, and proceed to instant WhatsApp order request at Nexora Electronics." />
  <!-- FontAwesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/nexora.css" />
</head>
<body>

  <!-- Component Mount Points -->
  <div id="nexora-topbar-mount"></div>
  <div id="nexora-header-mount"></div>
  <div id="nexora-category-nav-mount"></div>
  <div id="nexora-sub-nav-mount"></div>

  <!-- Breadcrumbs -->
  <div class="container" style="margin-top: 14px;">
    <div class="store-breadcrumbs">
      <a href="index.html">Home</a> <span>›</span>
      <span style="font-weight: 600; color: var(--text-heading);">Shopping Cart</span>
    </div>
  </div>

  <!-- Cart Main Content -->
  <main class="container" style="margin-top: 16px; margin-bottom: 48px;">
    <div class="cart-page-layout" style="display: grid; grid-template-columns: 1.6fr 1fr; gap: 28px; align-items: start;">
      
      <!-- Cart Items List -->
      <section id="cart-items-container">
        <!-- Rendered dynamically by NexoraApp.renderCartPage() -->
      </section>

      <!-- Cart Order Summary -->
      <aside id="cart-summary-container">
        <!-- Rendered dynamically by NexoraApp.renderCartPage() -->
      </aside>

    </div>
  </main>

  <!-- Component Mount Point: Footer -->
  <div id="nexora-footer-mount"></div>

  <!-- Core Scripts -->
  <script src="js/products-data.js"></script>
  <script src="js/nexora-components.js"></script>
  <script src="js/nexora.js"></script>
</body>
</html>
