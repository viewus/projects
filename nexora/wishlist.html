<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved Wishlist | NEXORA ELECTRONICS Showroom</title>
  <meta name="description" content="View your saved electronic devices, compare flagship specs, and transfer items to cart at Nexora Electronics." />
  <!-- FontAwesome 6 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/nexora.css" />
</head>
<body>

  <!-- Component Mount Points -->
  <div id="nexora-topbar-mount"></div>
  <div id="nexora-header-mount"></div>
  <div id="nexora-category-nav-mount"></div>
  <div id="nexora-sub-nav-mount"></div>

  <!-- Breadcrumbs -->
  <div class="container" style="margin-top: 14px;">
    <div class="store-breadcrumbs">
      <a href="index.html">Home</a> <span>›</span>
      <span style="font-weight: 600; color: var(--text-heading);">Saved Wishlist</span>
    </div>
  </div>

  <!-- Wishlist Main Content -->
  <main class="container" style="margin-top: 16px; margin-bottom: 48px;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-subtle);">
      <div>
        <h1 style="font-size: 1.8rem; font-weight: 900; color: var(--text-heading); font-family: var(--font-heading);">
          <i class="fa-solid fa-heart" style="color:#f43f5e; margin-right:8px;"></i>Your Saved Wishlist
        </h1>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 2px;">
          Hardware saved for showroom trial or direct WhatsApp reservation
        </p>
      </div>

      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button type="button" class="btn btn-primary" onclick="window.NexoraApp.moveAllWishlistToCart()">
          <i class="fa-solid fa-cart-arrow-down" style="margin-right:6px;"></i> Move All to Cart
        </button>
        <button type="button" class="btn btn-wa-green" onclick="window.NexoraApp.shareWishlistOnWhatsApp()">
          <i class="fa-brands fa-whatsapp" style="margin-right:6px;"></i> Share Wishlist on WhatsApp
        </button>
        <button type="button" class="btn btn-outline" onclick="window.NexoraApp.clearWishlist()">
          <i class="fa-solid fa-trash-can" style="margin-right:4px;"></i> Clear All
        </button>
      </div>
    </div>

    <!-- Wishlist Products Grid -->
    <div class="products-grid-layout" id="wishlist-products-grid">
      <!-- Rendered dynamically by NexoraApp.renderWishlistPage() -->
    </div>

  </main>

  <!-- Component Mount Point: Footer -->
  <div id="nexora-footer-mount"></div>

  <!-- Core Scripts -->
  <script src="js/products-data.js"></script>
  <script src="js/nexora-components.js"></script>
  <script src="js/nexora.js"></script>
</body>
</html>
