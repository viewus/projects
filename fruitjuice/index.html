<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="seo-title">Grove &amp; Glass | Cold-Pressed Juices</title>
<meta id="seo-description" name="description" content="Cold-pressed juices, freshly prepared daily.">
<meta id="seo-keywords" name="keywords" content="fresh juice, juice bar">
<meta id="og-title" property="og:title" content="Grove & Glass">
<meta id="og-description" property="og:description" content="Cold-pressed juices, freshly prepared daily.">
<meta id="og-image" property="og:image" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/aos@2.3.1/dist/aos.css">
<style>
  :root{
    --primary: #1F3A2E;
    --primary-light: #2E5544;
    --secondary: #C97C3D;
    --secondary-light: #E0A15E;
    --cream: #F6F1E6;
    --paper: #FCFAF4;
    --charcoal: #1B1B18;
    --text: #2A2E28;
    --text-muted: #6B6F63;
    --line: rgba(31,58,46,0.14);
    --shadow: 0 20px 60px -25px rgba(20,30,22,0.35);
    --radius: 2px;
    --dur: 700ms;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:'Manrope',sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  ul{list-style:none;margin:0;padding:0;}
  h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:500;margin:0;line-height:1.05;color:var(--primary);}
  .eyebrow{
    font-family:'Manrope',sans-serif;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--secondary);
    font-weight:700;
    display:inline-flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{content:"";width:26px;height:1px;background:var(--secondary);}
  .container{max-width:1240px;margin:0 auto;padding:0 32px;}
  section{position:relative;}
  .section-pad{padding:120px 0;}
  @media(max-width:768px){.section-pad{padding:72px 0;}}
  .center{text-align:center;}
  .section-head{max-width:720px;margin-bottom:56px;}
  .section-head.center{margin-left:auto;margin-right:auto;}
  .section-head h2{font-size:clamp(32px,4.2vw,52px);margin-top:14px;letter-spacing:-.01em;}
  .section-head p{margin-top:18px;color:var(--text-muted);font-size:17px;line-height:1.7;}
  /* citrus signature motif */
  .citrus-mark{display:inline-block;}
  .citrus-mark svg{display:block;}
  /* buttons */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    padding:16px 30px;
    font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
    border-radius:var(--radius);
    border:1px solid transparent;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), background .3s, color .3s, border-color .3s;
    white-space:nowrap;
  }
  .btn-primary{background:var(--primary);color:var(--cream);}
  .btn-primary:hover{background:var(--primary-light);transform:translateY(-2px);}
  .btn-outline{background:transparent;color:var(--primary);border-color:var(--primary);}
  .btn-outline:hover{background:var(--primary);color:var(--cream);transform:translateY(-2px);}
  .btn-gold{background:var(--secondary);color:#fff;}
  .btn-gold:hover{background:var(--secondary-light);transform:translateY(-2px);}
  .btn-ghost-light{background:transparent;color:var(--cream);border-color:rgba(246,241,230,.5);}
  .btn-ghost-light:hover{background:rgba(246,241,230,.12);}
  /* announcement bar */
  #announcement{
    background:var(--charcoal);color:var(--cream);
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    text-align:center;padding:10px 20px;font-weight:600;
  }
  /* header */
  header#site-header{
    position:sticky;top:0;z-index:500;
    background:rgba(252,250,244,.86);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
    transition:padding .3s ease, box-shadow .3s ease;
  }
  header#site-header.scrolled{box-shadow:0 8px 30px -20px rgba(0,0,0,.25);}
  .header-inner{display:flex;align-items:center;justify-content:space-between;padding:22px 0;transition:padding .3s ease;}
  header#site-header.scrolled .header-inner{padding:14px 0;}
  .brand-logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',serif;font-size:22px;color:var(--primary);font-weight:600;}
  .brand-logo .citrus-mark svg{width:26px;height:26px;}
  nav#main-nav{display:flex;gap:34px;}
  nav#main-nav a{
    font-size:13px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;color:var(--text);
    position:relative;padding:6px 0;transition:color .25s;
  }
  nav#main-nav a::after{content:"";position:absolute;left:0;bottom:0;width:0;height:1.5px;background:var(--secondary);transition:width .3s;}
  nav#main-nav a:hover,nav#main-nav a.active{color:var(--primary);}
  nav#main-nav a.active::after,nav#main-nav a:hover::after{width:100%;}
  .header-actions{display:flex;align-items:center;gap:14px;}
  .hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;padding:8px;}
  .hamburger span{width:24px;height:2px;background:var(--primary);display:block;transition:.3s;}
  /* mobile nav */
  #mobile-nav{
    position:fixed;inset:0;background:var(--primary);z-index:900;
    transform:translateX(100%);transition:transform .5s cubic-bezier(.2,.9,.2,1);
    display:flex;flex-direction:column;padding:100px 40px 40px;
  }
  #mobile-nav.open{transform:translateX(0);}
  #mobile-nav a{color:var(--cream);font-family:'Fraunces',serif;font-size:28px;padding:14px 0;border-bottom:1px solid rgba(246,241,230,.15);}
  #mobile-nav-close{position:absolute;top:26px;right:28px;background:none;border:none;color:var(--cream);font-size:26px;}
  #mobile-nav .mobile-cta{margin-top:30px;}
  /* hero */
  #hero{
    min-height:92vh;display:flex;align-items:center;
    background:linear-gradient(180deg,var(--cream) 0%, var(--paper) 100%);
    padding-top:60px;overflow:hidden;position:relative;
  }
  .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:60px;align-items:center;}
  .hero-copy h1{font-size:clamp(44px,6.4vw,84px);letter-spacing:-.015em;}
  .hero-copy .eyebrow{margin-bottom:20px;}
  .hero-copy p.lead{margin-top:26px;font-size:18px;color:var(--text-muted);max-width:480px;line-height:1.75;}
  .hero-ctas{display:flex;gap:16px;margin-top:38px;flex-wrap:wrap;}
  .hero-badges{display:flex;gap:34px;margin-top:56px;flex-wrap:wrap;}
  .hero-badges .badge{font-size:13px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:8px;}
  .hero-badges .badge i{color:var(--secondary);}
  .hero-visual{position:relative;}
  .hero-visual img{width:100%;height:600px;object-fit:cover;border-radius:6px;box-shadow:var(--shadow);}
  .hero-visual .float-card{
    position:absolute;bottom:-30px;left:-40px;background:var(--paper);padding:20px 24px;
    box-shadow:var(--shadow);border-radius:4px;display:flex;align-items:center;gap:14px;max-width:230px;
  }
  .hero-visual .float-card .citrus-mark svg{width:38px;height:38px;}
  .hero-visual .float-card strong{display:block;font-family:'Fraunces',serif;font-size:15px;color:var(--primary);}
  .hero-visual .float-card span{font-size:12px;color:var(--text-muted);}
  @media(max-width:960px){
    .hero-grid{grid-template-columns:1fr;}
    .hero-visual{order:-1;}
    .hero-visual img{height:360px;}
    .hero-visual .float-card{left:0;}
  }
  /* banner */
  #banner{
    background:var(--primary);color:var(--cream);padding:140px 0;position:relative;
    background-size:cover;background-position:center;
  }
  #banner .banner-overlay{position:absolute;inset:0;background:linear-gradient(120deg,rgba(15,26,20,.92),rgba(15,26,20,.62));}
  #banner .container{position:relative;z-index:2;max-width:920px;text-align:center;}
  #banner h2{color:var(--cream);font-size:clamp(30px,4.6vw,54px);}
  #banner p{margin-top:22px;font-size:18px;color:rgba(246,241,230,.82);line-height:1.8;}
  /* about */
  #about .about-grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:70px;align-items:center;}
  #about .about-img{position:relative;}
  #about .about-img img{width:100%;height:560px;object-fit:cover;border-radius:4px;}
  #about .about-img .ring{position:absolute;top:-26px;right:-26px;width:110px;height:110px;}
  #about p{color:var(--text-muted);font-size:16.5px;line-height:1.85;margin-top:20px;}
  #about .about-list{margin-top:30px;display:grid;gap:16px;}
  #about .about-list li{display:flex;gap:12px;font-size:15px;color:var(--text);}
  #about .about-list i{color:var(--secondary);margin-top:3px;}
  @media(max-width:900px){#about .about-grid{grid-template-columns:1fr;}#about .about-img img{height:380px;}}
  /* stats */
  #stats{background:var(--cream);}
  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:30px;text-align:center;}
  .stat-num{font-family:'Fraunces',serif;font-size:clamp(36px,4vw,56px);color:var(--primary);}
  .stat-label{margin-top:8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);font-weight:700;}
  @media(max-width:768px){.stats-grid{grid-template-columns:repeat(2,1fr);gap:36px 20px;}}
  /* why us */
  .whyus-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);}
  .whyus-card{background:var(--paper);padding:38px 28px;}
  .whyus-card i{font-size:24px;color:var(--secondary);}
  .whyus-card h4{font-size:18px;margin-top:18px;}
  .whyus-card p{margin-top:10px;font-size:14px;color:var(--text-muted);line-height:1.7;}
  @media(max-width:900px){.whyus-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:560px){.whyus-grid{grid-template-columns:1fr;}}
  /* signature juices */
  .sig-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;}
  .sig-card{background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;transition:transform .4s ease, box-shadow .4s ease;}
  .sig-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);}
  .sig-card .sig-img{height:260px;overflow:hidden;}
  .sig-card .sig-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease;}
  .sig-card:hover .sig-img img{transform:scale(1.06);}
  .sig-card .sig-body{padding:26px;}
  .sig-card .sig-cat{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--secondary);font-weight:700;}
  .sig-card h3{margin-top:8px;font-size:22px;}
  .sig-card p{margin-top:10px;color:var(--text-muted);font-size:14.5px;line-height:1.7;}
  .sig-card .sig-highlight{margin-top:16px;display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--primary);}
  @media(max-width:960px){.sig-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:620px){.sig-grid{grid-template-columns:1fr;}}
  /* categories */
  #categories-bar{position:sticky;top:73px;z-index:60;background:var(--paper);border-bottom:1px solid var(--line);padding:18px 0;}
  header#site-header.scrolled ~ * #categories-bar{top:57px;}
  .cat-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .cat-scroll::-webkit-scrollbar{display:none;}
  .cat-pill{
    flex:0 0 auto;padding:10px 22px;border:1px solid var(--line);border-radius:30px;
    font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--text);background:transparent;
    transition:all .3s ease;
  }
  .cat-pill.active,.cat-pill:hover{background:var(--primary);color:var(--cream);border-color:var(--primary);}
  /* juice explore */
  #juices .juice-toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:40px;flex-wrap:wrap;}
  .search-box{position:relative;}
  .search-box input{
    padding:13px 20px 13px 42px;border:1px solid var(--line);border-radius:30px;min-width:260px;
    font-family:'Manrope',sans-serif;font-size:14px;background:var(--paper);color:var(--text);
  }
  .search-box input:focus{outline:2px solid var(--secondary);outline-offset:1px;}
  .search-box i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text-muted);}
  .juice-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;}
  @media(max-width:1100px){.juice-grid{grid-template-columns:repeat(3,1fr);}}
  @media(max-width:768px){.juice-grid{grid-template-columns:repeat(2,1fr);}}
  @media(max-width:480px){.juice-grid{grid-template-columns:1fr;}}
  .juice-card{
    background:var(--paper);border:1px solid var(--line);border-radius:4px;overflow:hidden;cursor:pointer;
    transition:transform .4s ease, box-shadow .4s ease, opacity .3s ease;
  }
  .juice-card:hover{transform:translateY(-5px);box-shadow:var(--shadow);}
  .juice-card .jc-img{height:200px;overflow:hidden;position:relative;}
  .juice-card .jc-img img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease;}
  .juice-card:hover .jc-img img{transform:scale(1.08);}
  .juice-card .jc-badge{
    position:absolute;top:12px;left:12px;background:rgba(252,250,244,.92);color:var(--primary);
    font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:20px;
  }
  .juice-card .jc-body{padding:20px;}
  .juice-card .jc-cat{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--secondary);font-weight:700;}
  .juice-card h4{margin-top:6px;font-size:18px;font-family:'Fraunces',serif;color:var(--primary);}
  .juice-card p{margin-top:8px;font-size:13.5px;color:var(--text-muted);line-height:1.6;}
  .juice-card .jc-foot{margin-top:14px;display:flex;justify-content:space-between;align-items:center;}
  .jc-foot span{font-size:11.5px;font-weight:700;color:var(--primary);}
  .jc-foot i{color:var(--secondary);}
  .no-results{text-align:center;padding:60px 20px;color:var(--text-muted);display:none;}
  /* modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(17,24,18,.7);z-index:1000;display:none;
    align-items:center;justify-content:center;padding:24px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:var(--paper);max-width:920px;width:100%;max-height:88vh;overflow-y:auto;border-radius:6px;
    display:grid;grid-template-columns:1fr 1fr;position:relative;opacity:0;transform:translateY(20px) scale(.98);
    transition:opacity .35s ease, transform .35s ease;
  }
  .modal-overlay.open .modal-box{opacity:1;transform:translateY(0) scale(1);}
  .modal-close{position:absolute;top:18px;right:18px;background:var(--paper);border:none;width:38px;height:38px;border-radius:50%;font-size:18px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.15);}
  .modal-img{height:100%;min-height:320px;}
  .modal-img img{width:100%;height:100%;object-fit:cover;}
  .modal-content{padding:40px;}
  .modal-content .jc-cat{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--secondary);font-weight:700;}
  .modal-content h3{margin-top:10px;font-size:30px;}
  .modal-content p.desc{margin-top:14px;color:var(--text-muted);line-height:1.75;}
  .modal-section{margin-top:22px;}
  .modal-section h5{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--primary);font-weight:800;margin-bottom:10px;}
  .tag-list{display:flex;flex-wrap:wrap;gap:8px;}
  .tag-list span{background:var(--cream);padding:6px 14px;border-radius:20px;font-size:12.5px;color:var(--text);}
  .modal-content .modal-cta{margin-top:28px;}
  @media(max-width:700px){.modal-box{grid-template-columns:1fr;}.modal-img{min-height:220px;}}
  /* health */
  #health{background:var(--primary);color:var(--cream);}
  #health .section-head h2{color:var(--cream);}
  #health .section-head p{color:rgba(246,241,230,.75);}
  #health .eyebrow{color:var(--secondary-light);}
  #health .eyebrow::before{background:var(--secondary-light);}
  .health-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:rgba(246,241,230,.14);}
  .health-card{background:var(--primary);padding:36px 30px;}
  .health-card i{font-size:26px;color:var(--secondary-light);}
  .health-card h4{color:var(--cream);font-size:20px;margin-top:16px;}
  .health-card p{color:rgba(246,241,230,.72);font-size:14.5px;margin-top:10px;line-height:1.7;}
  @media(max-width:900px){.health-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:560px){.health-grid{grid-template-columns:1fr;}}
  /* customisation */
  .custom-grid{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;}
  .custom-grid img{width:100%;height:480px;object-fit:cover;border-radius:4px;}
  .custom-options{margin-top:26px;display:grid;gap:0;}
  .custom-options .opt{display:flex;justify-content:space-between;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);}
  .custom-options .opt span{font-weight:600;}
  .custom-options .opt i{color:var(--secondary);}
  @media(max-width:900px){.custom-grid{grid-template-columns:1fr;}.custom-grid img{height:320px;}}
  /* create-for-you */
  #create-for-you{background:var(--cream);}
  .create-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .create-pill{
    background:var(--paper);border:1px solid var(--line);padding:26px 22px;border-radius:4px;
    display:flex;justify-content:space-between;align-items:center;transition:.3s;
  }
  .create-pill:hover{background:var(--primary);border-color:var(--primary);}
  .create-pill:hover span, .create-pill:hover i{color:var(--cream);}
  .create-pill span{font-weight:600;font-size:15px;}
  .create-pill i{color:var(--secondary);transition:.3s;}
  @media(max-width:860px){.create-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:560px){.create-grid{grid-template-columns:1fr;}}
  /* hygiene */
  #hygiene{background:var(--charcoal);color:var(--cream);}
  #hygiene .section-head h2{color:var(--cream);}
  #hygiene .section-head p{color:rgba(246,241,230,.7);}
  .hygiene-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px;}
  .hygiene-card{padding:30px 22px;border:1px solid rgba(246,241,230,.15);border-radius:4px;}
  .hygiene-card i{font-size:22px;color:var(--secondary-light);}
  .hygiene-card h4{color:var(--cream);font-size:16px;margin-top:16px;font-family:'Fraunces',serif;font-weight:500;}
  .hygiene-card p{color:rgba(246,241,230,.65);font-size:13.5px;margin-top:8px;line-height:1.6;}
  @media(max-width:900px){.hygiene-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:560px){.hygiene-grid{grid-template-columns:1fr;}}
  /* quality */
  .quality-list{border-top:1px solid var(--line);}
  .quality-row{display:grid;grid-template-columns:90px 1fr;gap:26px;padding:30px 0;border-bottom:1px solid var(--line);align-items:baseline;}
  .quality-row .qnum{font-family:'Fraunces',serif;font-size:32px;color:var(--secondary);}
  .quality-row h4{font-size:21px;}
  .quality-row p{margin-top:8px;color:var(--text-muted);font-size:15px;line-height:1.7;max-width:600px;}
  /* ingredients */
  #ingredients{background:var(--cream);}
  .ingredient-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;}
  .ingredient-item{text-align:center;}
  .ingredient-item .ring-img{width:100%;aspect-ratio:1/1;border-radius:50%;overflow:hidden;border:1px solid var(--line);}
  .ingredient-item .ring-img img{width:100%;height:100%;object-fit:cover;}
  .ingredient-item span{display:block;margin-top:12px;font-size:13px;font-weight:700;color:var(--primary);}
  @media(max-width:900px){.ingredient-grid{grid-template-columns:repeat(3,1fr);gap:28px 16px;}}
  /* seasonal */
  .seasonal-strip{display:flex;gap:20px;overflow-x:auto;padding-bottom:10px;}
  .seasonal-card{flex:0 0 220px;position:relative;height:280px;border-radius:4px;overflow:hidden;}
  .seasonal-card img{width:100%;height:100%;object-fit:cover;}
  .seasonal-card .s-label{
    position:absolute;bottom:0;left:0;right:0;padding:18px;

  function animateCounters(){
    $(".stat-num").each(function(){
      var $el = $(this);
      if($el.data("done")) return;
      var raw = $el.data("count").toString();
      var match = raw.match(/[\d.]+/);
      if(!match){ $el.text(raw); $el.data("done", true); return; }
      var num = parseFloat(match[0]);
      var suffix = raw.replace(match[0], "");
      var current = 0;
      var steps = 40;
      var inc = num / steps;
      $el.data("done", true);
      var i = 0;
      var timer = setInterval(function(){
        i++;
        current += inc;
        if(i >= steps){ clearInterval(timer); current = num; }
        var display = (num % 1 === 0) ? Math.round(current) : current.toFixed(1);
        $el.text(display + suffix);
      }, 25);
    });
  }

        '</div>' +
        '<div class="contact-grid">' +

              '<div class="contact-row"><i class="fa-brands fa-whatsapp"></i><div><strong>WhatsApp</strong><a id="contact-wa" href="#">+91 '+esc(c.phone)+'</a></div></div>' +
              '<div class="contact-row"><i class="fa-solid fa-envelope"></i><div><strong>Email</strong><a href="mailto:'+esc(c.email)+'">'+esc(c.email)+'</a></div></div>' +
              '<div class="contact-row"><i class="fa-solid fa-location-dot"></i><div><strong>Address</strong><span>'+esc(c.address)+'</span></div></div>' +
              '<div class="contact-row"><i class="fa-solid fa-clock"></i><div><strong>Opening Hours</strong><span>'+esc(c.hours)+'</span></div></div>' +
            '</div>' +
            '<div class="contact-ctas">' +
              '<a class="btn btn-primary" href="'+telLink()+'"><i class="fa-solid fa-phone"></i> Call Us</a>' +
              '<a class="btn btn-gold" id="contact-wa-btn" href="#"><i class="fa-brands fa-whatsapp"></i> WhatsApp Us</a>' +
            '</div>' +
          '</div>' +
          '<div class="contact-form-card" data-aos="fade-left">' +
            '<span class="eyebrow">'+esc(cf.eyebrow)+'</span>' +
            '<h3 style="font-size:22px;color:var(--cream);margin-top:10px;">'+esc(cf.title)+'</h3>' +
            '<p class="form-lead">'+esc(cf.text)+'</p>' +
            '<form id="contact-form" novalidate>' +
              '<div class="form-field"><label for="cf-name">'+esc(cf.fields.name.label)+'</label>' +
                '<input type="text" id="cf-name" placeholder="'+esc(cf.fields.name.placeholder)+'" required></div>' +
              '<div class="form-field"><label for="cf-phone">'+esc(cf.fields.phone.label)+'</label>' +
                '<input type="tel" id="cf-phone" placeholder="'+esc(cf.fields.phone.placeholder)+'" required></div>' +
              '<div class="form-field"><label for="cf-reason">Reason</label>' +
                '<select id="cf-reason">'+reasonOptions+'</select></div>' +
              '<div class="form-field"><label for="cf-message">'+esc(cf.fields.message.label)+'</label>' +
                '<textarea id="cf-message" placeholder="'+esc(cf.fields.message.placeholder)+'" required></textarea></div>' +
              '<p class="form-error" id="cf-error">Please add your name, phone number and a short message before sending.</p>' +
              '<button type="submit" class="btn btn-gold"><i class="fa-brands fa-whatsapp"></i> '+esc(cf.submitLabel)+'</button>' +
              '<p class="form-note">'+esc(cf.note)+'</p>' +
            '</form>' +
          '</div>' +
        '</div>' +
        '<div class="map-section" data-aos="fade-up">' +
          '<div class="map-head-row">' +
            '<div class="section-head">' +
              '<span class="eyebrow">'+esc(data.map.eyebrow)+'</span>' +
              '<h2 style="font-size:clamp(26px,3.4vw,38px);">'+esc(data.map.title)+'</h2>' +
            '</div>' +
            '<a class="btn btn-ghost-light" id="directions-btn" href="#" target="_blank" rel="noopener"><i class="fa-solid fa-diamond-turn-right"></i> '+esc(data.map.directionsLabel)+'</a>' +
          '</div>' +
          '<div class="map-frame-wrap"><iframe id="contact-map-iframe" src="" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Grove & Glass location map"></iframe></div>' +
        '</div>' +
      '</div>'
    );
    $("#contact-wa, #contact-wa-btn").attr("href", waLink(data.whatsappMessages.general));
    var mapSrc = c.mapEmbedUrl && c.mapEmbedUrl.length
      ? c.mapEmbedUrl
      : "https://www.google.com/maps?q=" + encodeURIComponent(c.address) + "&output=embed";
    $("#contact-map-iframe").attr("src", mapSrc);
    $("#directions-btn").attr("href", "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(c.address));
  }
  function initializeContactForm(){
    $(document).on("submit", "#contact-form", function(e){
      e.preventDefault();
      var name = $("#cf-name").val().trim();
      var phone = $("#cf-phone").val().trim();
      var reason = $("#cf-reason").val();
      var message = $("#cf-message").val().trim();
      if(!name || !phone || !message){
        $("#cf-error").addClass("show");
        return;
      }
      $("#cf-error").removeClass("show");
      var text = "Hello Grove & Glass,\n\n" +
        "Name: " + name + "\n" +
        "Phone: " + phone + "\n" +
        "Reason: " + reason + "\n\n" +
        message + "\n\n" +
        "Thank you.";
      window.open(waLink(text), "_blank");
    });
  }
  function renderFooter(){
    var f = data.footer;
    var navLinks = data.navigation.map(function(n){ return '<li><a href="'+n.target+'" data-target="'+n.target+'">'+esc(n.label)+'</a></li>'; }).join("");
    var catLinks = data.categories.filter(function(c){ return c !== "All"; }).slice(0,6).map(function(c){
      return '<li><a href="#juices" data-cat-link="'+esc(c)+'">'+esc(c)+'</a></li>';
    }).join("");
    var social = data.socialLinks.map(function(s){ return '<a href="'+s.url+'" aria-label="'+esc(s.platform)+'"><i class="'+s.icon+'"></i></a>'; }).join("");
    $("#site-footer").html(
      '<div class="container">' +
        '<div class="footer-grid">' +
          '<div class="footer-brand">' +
            '<div class="brand-logo">'+citrusMark(24)+'<span>'+esc(data.brand.shortName)+'</span></div>' +
            '<p>'+esc(data.brand.description)+'</p>' +
            '<div class="footer-social">'+social+'</div>' +
          '</div>' +
          '<div class="footer-col"><h5>'+esc(f.linksHeading)+'</h5><ul>'+navLinks+'</ul></div>' +
          '<div class="footer-col"><h5>'+esc(f.categoriesHeading)+'</h5><ul>'+catLinks+'</ul></div>' +
          '<div class="footer-col"><h5>'+esc(f.contactHeading)+'</h5><ul>' +
            '<li><a href="'+telLink()+'">+91 '+esc(data.contact.phone)+'</a></li>' +
            '<li><a href="'+waLink(data.whatsappMessages.general)+'">WhatsApp Us</a></li>' +
            '<li><a href="mailto:'+esc(data.contact.email)+'">'+esc(data.contact.email)+'</a></li>' +
            '<li>'+esc(data.contact.address)+'</li>' +
          '</ul></div>' +
        '</div>' +
        '<div class="footer-bottom"><span>&copy; '+new Date().getFullYear()+' '+esc(f.copyright)+'</span><span>'+esc(data.brand.location)+'</span></div>' +
      '</div>'
    );
  }
  function renderFinalCta(){
    if(!vis.finalCta){ $("#final-cta").hide(); return; }
    var fc = data.finalCta;
    $("#final-cta").css("background-image", "url('"+fc.image+"')").html(
      '<div class="fc-overlay"></div>' +
      '<div class="container" data-aos="fade-up">' +
        '<h2>'+esc(fc.title)+'</h2>' +
        '<p>'+esc(fc.text)+'</p>' +
        '<div class="fc-ctas">' +
          '<a class="btn btn-gold" id="fc-whatsapp" href="#"><i class="fa-brands fa-whatsapp"></i> '+esc(fc.primaryCta.label)+'</a>' +
          '<a class="btn btn-ghost-light" href="'+telLink()+'"><i class="fa-solid fa-phone"></i> '+esc(fc.secondaryCta.label)+'</a>' +
        '</div>' +
      '</div>'
    );
    $("#fc-whatsapp").attr("href", waLink(data.whatsappMessages.general));
  }
  function renderFloatingWhatsApp(){
    $("#whatsapp-float").attr("href", waLink(data.whatsappMessages.general));
  }
  /* ---------- interactions ---------- */
  function initializeNavigation(){
    $(document).on("click", "a[data-target]", function(e){
      var target = $(this).data("target");
      if(target && target.charAt(0) === "#"){
        e.preventDefault();
        $("#mobile-nav").removeClass("open");
        var $t = $(target);
        if($t.length){
          $("html,body").animate({ scrollTop: $t.offset().top - 64 }, 700);
        }
      }
    });
    $(document).on("click", "[data-cat-link]", function(e){
      e.preventDefault();
      currentFilter = $(this).data("cat-link");
      $("html,body").animate({ scrollTop: $("#juices").offset().top - 64 }, 700, function(){
        renderCategories();
        renderJuices();
      });
    });
    $(window).on("scroll", function(){
      var scrollTop = $(window).scrollTop();
      $("#site-header").toggleClass("scrolled", scrollTop > 40);
      $("#back-to-top").toggleClass("show", scrollTop > 600);
      var current = "";
      $("section[id]").each(function(){
        var top = $(this).offset().top - 120;
        if(scrollTop >= top) current = "#" + $(this).attr("id");
      });
      $("#main-nav a").removeClass("active").each(function(){
        if($(this).data("target") === current) $(this).addClass("active");
      });
      if($("#stats").length && !window.__statsAnimated){
        var statsTop = $("#stats").offset() ? $("#stats").offset().top : 0;
        if(scrollTop + $(window).height() > statsTop + 80){
          window.__statsAnimated = true;
          animateCounters();
        }
      }
    });
    $("#hamburger-btn").on("click", function(){ $("#mobile-nav").addClass("open"); });
    $("#mobile-nav-close").on("click", function(){ $("#mobile-nav").removeClass("open"); });
  }
  function initializeJuiceModal(){
    $("#juice-grid").on("click keypress", ".juice-card", function(e){
      if(e.type === "keypress" && e.which !== 13) return;
      openJuiceModal($(this).data("id"));
    });
    $("#modal-close-btn, #juice-modal").on("click", function(e){
      if(e.target.id === "juice-modal" || e.target.id === "modal-close-btn" || $(e.target).closest("#modal-close-btn").length){
        closeJuiceModal();
      }
    });
    $(document).on("keydown", function(e){
      if(e.key === "Escape"){ closeJuiceModal(); closeLightbox(); }
    });
  }
  function openJuiceModal(id){
    var j = data.juices.find(function(x){ return x.id === id; });
    if(!j) return;
    $("#modal-img").attr("src", j.image).attr("alt", j.name);
    var ingredients = j.ingredients.map(function(i){ return "<span>"+esc(i)+"</span>"; }).join("");
    var whatsMsg = data.whatsappMessages.juice.replace("{juiceName}", j.name);
    $("#modal-content").html(
      '<span class="jc-cat">'+esc(j.category)+'</span>' +
      '<h3>'+esc(j.name)+'</h3>' +
      '<p class="desc">'+esc(j.description)+'</p>' +
      '<div class="modal-section"><h5>Ingredients</h5><div class="tag-list">'+ingredients+'</div></div>' +
      '<div class="modal-section"><h5>Why You\'ll Love It</h5><p style="color:var(--text-muted);font-size:14.5px;line-height:1.7;">'+esc(j.lovedFor)+'</p></div>' +
      '<div class="modal-section"><h5>Health Highlight</h5><div class="tag-list"><span>'+esc(j.highlight)+'</span></div></div>' +
      '<div class="modal-section"><h5>Best Time To Enjoy</h5><div class="tag-list"><span>'+esc(j.bestTime)+'</span></div></div>' +
      '<a class="btn btn-gold modal-cta" href="'+waLink(whatsMsg)+'"><i class="fa-brands fa-whatsapp"></i> Ask About This Juice</a>'
    );
    $("#juice-modal").addClass("open");
    $("body").css("overflow", "hidden");
  }
  function closeJuiceModal(){
    $("#juice-modal").removeClass("open");
    $("body").css("overflow", "");
  }
  function initializeGalleryLightbox(){
    $("#gallery").on("click", ".gallery-item", function(){
      $("#lightbox-img").attr("src", $(this).data("img")).attr("alt", $(this).data("cap"));
      $("#lightbox").addClass("open");
    });
    $("#lightbox-close-btn, #lightbox").on("click", function(e){
      if(e.target.id === "lightbox" || e.target.id === "lightbox-close-btn" || $(e.target).closest("#lightbox-close-btn").length){
        closeLightbox();
      }
    });
  }
  function closeLightbox(){ $("#lightbox").removeClass("open"); }
  function initializeBackToTop(){
    $("#back-to-top").on("click", function(){
      $("html,body").animate({ scrollTop: 0 }, 700);
    });
  }
  function initializeAnimations(){
    if(data.animations && data.animations.enabled){
      AOS.init({ duration: data.animations.duration || 700, once: data.animations.once !== false, offset: 60, easing: "ease-out-cubic" });
    }
  }
  /* ---------- boot ---------- */
  function loadData(){
    applyTheme();
    applySEO();
    renderAnnouncement();
    renderNavigation();
    renderHero();
    renderBanner();
    renderAbout();
    renderStats();
    renderWhyUs();
    renderSignatureJuices();
    renderCategories();
    renderJuices();
    renderHealth();
    renderCustomisation();
    renderCreateForYou();
    renderHygiene();
    renderQuality();
    renderIngredients();
    renderSeasonal();
    renderGallery();
    renderExperiences();
    renderCatering();
    renderTestimonials();
    renderPress();
    renderFAQ();
    renderContact();
    renderFinalCta();
    renderFooter();
    renderFloatingWhatsApp();
    initializeFilters();
    initializeSearch();
    initializeJuiceModal();
    initializeGalleryLightbox();
    initializeNavigation();
    initializeTestimonials();
    initializeFAQ();
    initializeContactForm();
    initializeBackToTop();
    initializeAnimations();
  }
  $(document).ready(loadData);
})();
</script>
