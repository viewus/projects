<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: Inter, -apple-system, sans-serif;
    font-size: 12px;
    color: #14101F;
    background: #FBFAFF;
  }
  h1 {
    font-size: 14px;
    margin: 0 0 4px;
  }
  p.sub {
    margin: 0 0 16px;
    color: #635C7A;
    line-height: 1.5;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #FFFFFF;
    border: 1px solid #E4DEF2;
    border-radius: 4px;
    padding: 10px 12px;
    margin-bottom: 10px;
  }
  .step.disabled {
    opacity: 0.45;
  }
  .num {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 4px;
    background: #815BB5;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 11px;
  }
  .label {
    flex: 1;
  }
  .label strong { display: block; font-size: 12px; }
  .label span { display: block; color: #635C7A; font-size: 10.5px; margin-top: 1px; }
  button {
    border: none;
    border-radius: 4px;
    background: #815BB5;
    color: #fff;
    font-size: 11px;
    font-weight: 600;
    padding: 7px 12px;
    cursor: pointer;
  }
  button:hover { background: #684CAC; }
  button:disabled { background: #D1D5DB; cursor: not-allowed; }
  #log {
    margin-top: 12px;
    padding: 8px 10px;
    background: #F1EEFB;
    border-radius: 4px;
    min-height: 40px;
    max-height: 90px;
    overflow-y: auto;
    font-size: 10.5px;
    color: #372F52;
    line-height: 1.5;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
  <h1>Tutedude Design System Builder</h1>
  <p class="sub">Run each step in order, review it in Figma, then run the next.</p>

  <div class="step">
    <span class="num">1</span>
    <div class="label">
      <strong>Build Foundations</strong>
      <span>Color, text &amp; effect styles</span>
    </div>
    <button id="btn-foundations">Run</button>
  </div>

  <div class="step">
    <span class="num">2</span>
    <div class="label">
      <strong>Build Icon Library</strong>
      <span>27 icon components</span>
    </div>
    <button id="btn-icons">Run</button>
  </div>

  <div id="log">Ready.</div>

<script>
  const log = (msg) => {
    const el = document.getElementById('log');
    el.textContent = msg;
  };

  document.getElementById('btn-foundations').onclick = () => {
    log('Building foundations…');
    parent.postMessage({ pluginMessage: { type: 'build-foundations' } }, '*');
  };

  document.getElementById('btn-icons').onclick = () => {
    log('Building icon library…');
    parent.postMessage({ pluginMessage: { type: 'build-icons' } }, '*');
  };

  window.onmessage = (event) => {
    const msg = event.data.pluginMessage;
    if (!msg) return;
    if (msg.type === 'done') log('Done: ' + msg.step);
    if (msg.type === 'error') log('Error in ' + msg.step + ': ' + msg.message);
  };
</script>
</body>
</html>
