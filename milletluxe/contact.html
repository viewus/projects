<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact Us | MilletLuxe</title>
<meta name="description" content="Get in touch with MilletLuxe for bulk orders, wholesale partnerships, or general questions about our heirloom millets." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="ml-header"></div>

<main>
  <section class="page-header" data-page="contact"></section>

  <section class="section">
    <div class="container">
      <div class="section-head" id="contactIntroMount"></div>

      <div class="split" style="align-items:flex-start;">
        <div data-aos="fade-right">
          <form id="contactForm" novalidate>
            <div class="form-grid">
              <div class="field">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Your name" required />
              </div>
              <div class="field">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required />
              </div>
              <div class="field">
                <label for="phone">Phone (optional)</label>
                <input type="tel" id="phone" name="phone" placeholder="+91 90000 00000" />
              </div>
              <div class="field">
                <label for="subject">Subject</label>
                <select id="subject" name="subject">
                  <option>General Enquiry</option>
                  <option>Bulk / Wholesale Order</option>
                  <option>Recipe Question</option>
                  <option>Partnership</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="field full">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="Tell us a little about what you need..." required></textarea>
              </div>
              <!-- honeypot field, hidden from real visitors, catches simple bots -->
              <div class="field full" style="position:absolute; left:-9999px; opacity:0; height:0; overflow:hidden;" aria-hidden="true">
                <label for="website">Website</label>
                <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
              </div>
              <div class="field full">
                <button type="submit" class="btn btn-gold">Send Message <i class="fa-solid fa-paper-plane"></i></button>
              </div>
              <div class="field full">
                <p class="form-note" id="formNoteMount"></p>
                <div class="form-status" id="formStatus"></div>
              </div>
            </div>
          </form>
        </div>

        <div data-aos="fade-left">
          <div class="grid" style="gap:16px; margin-bottom:26px;" id="contactInfoMount"></div>
          <div class="split-media" style="aspect-ratio:4/3;">
            <iframe id="mapMount" title="MilletLuxe location map" style="width:100%; height:100%; border:0;" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div id="ml-footer"></div>

<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script src="js/contact.js"></script>
</body>
</html>
