<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nutrition Guide | MilletLuxe</title>
<meta name="description" content="Compare the fiber, iron, calcium and glycemic index of millets against refined rice and wheat." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="ml-header"></div>

<main>
  <section class="page-header" data-page="nutrition"></section>

  <section class="section" id="nutritionIntroMount"></section>

  <section class="section section-alt">
    <div class="container">
      <div class="section-head" id="comparisonHeadMount"></div>
      <div id="nutritionChart" style="max-width:760px; margin:0 auto 44px;"></div>
      <details style="max-width:760px; margin:0 auto;">
        <summary style="cursor:pointer; font-size:.82rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--clr-ink-soft); text-align:center;">View as table</summary>
        <div class="compare-table-wrap" id="comparisonMount" style="margin-top:20px;"></div>
      </details>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <div class="section-head" id="insightsHeadMount"></div>
      <div class="grid grid-4" id="insightsMount"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head" id="benefitsHeadMount"></div>
      <div class="feature-list grid grid-2" style="gap:26px;" id="benefitsMount"></div>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <p class="form-note text-center" id="disclaimerMount" style="max-width:720px; margin:0 auto;"></p>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <div class="cta-band" data-aos="zoom-in" id="ctaBandMount"></div>
    </div>
  </section>
</main>

<div id="ml-footer"></div>

<script src="js/components.js"></script>
<script src="js/main.js"></script>
</body>
</html>
