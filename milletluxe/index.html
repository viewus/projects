<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MilletLuxe | Heirloom Millets, Stone-Milled &amp; Traceable</title>
<meta name="description" content="MilletLuxe brings heirloom, stone-milled millets from smallholder farms to your table — traceable sourcing, rich nutrition, and recipes for the modern kitchen." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div id="ml-header"></div>

<main>
  <!-- All copy below is injected at runtime from data/site.json (pages.index) by js/main.js -->
  <section class="hero" id="heroMount"></section>

  <div class="marquee" id="marqueeMount"></div>

  <section class="section" id="introMount"></section>

  <section class="section section-alt">
    <div class="container">
      <div class="section-head" id="varietiesSectionMount"></div>
      <div class="grid grid-4" id="featuredVarieties">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
      <div class="text-center" id="varietiesSectionCta" style="margin-top:44px;"></div>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <div class="stat-strip" id="statsMount"></div>
    </div>
  </section>

  <section class="section" id="sourcingMount"></section>

  <section class="section section-alt">
    <div class="container">
      <div class="section-head" id="recipesSectionMount"></div>
      <div class="grid grid-3" id="featuredRecipes">
        <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
      </div>
      <div class="text-center" id="recipesSectionCta" style="margin-top:44px;"></div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="section-head" id="testimonialsSectionMount"></div>
      <div id="testimonials"><div class="skeleton" style="min-height:280px;"></div></div>
    </div>
  </section>

  <section class="section-tight">
    <div class="container">
      <div class="cta-band" data-aos="zoom-in" id="ctaBandMount"></div>
    </div>
  </section>
</main>

<div id="ml-footer"></div>

<script src="js/components.js"></script>
<script src="js/main.js"></script>
</body>
</html>
